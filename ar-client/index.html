<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Spatial Tagging App</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; touch-action: pan-x pan-y; }
      body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: -apple-system, sans-serif; }

      /* ── Camera feed ── */
      #camera-feed {
        position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh;
        object-fit: cover;
        display: none;
        z-index: 0;
        touch-action: none;   /* prevent pinch-zoom on video element */
      }

      /* ── Three.js canvas ── */
      #ar-canvas {
        position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh;
        display: block;
        z-index: 1;
        touch-action: none;   /* prevent pinch-zoom on canvas */
      }

      /* ── QR overlay canvas (drawn on top of camera) ── */
      #qr-overlay {
        position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh;
        pointer-events: none;
        z-index: 3;
        display: none;
      }

      /* ── Status bar ── */
      #status {
        position: fixed; top: 16px; left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.72);
        color: #fff;
        padding: 10px 18px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 500;
        z-index: 10;
        max-width: 88vw;
        text-align: center;
        backdrop-filter: blur(6px);
      }

      /* ── PASS / FAIL result banner ── */
      #result-banner {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        padding: 24px 40px;
        border-radius: 16px;
        font-size: 36px;
        font-weight: 800;
        color: #fff;
        z-index: 20;
        display: none;
        text-align: center;
        backdrop-filter: blur(12px);
        letter-spacing: 2px;
      }
      #result-banner.pass { background: rgba(0, 200, 80, 0.88); }
      #result-banner.fail { background: rgba(220, 38, 38, 0.88); }

      /* ── Action buttons ── */
      #action-bar {
        position: fixed; bottom: 32px; left: 50%;
        transform: translateX(-50%);
        display: flex; gap: 12px;
        z-index: 10;
      }
      .btn {
        padding: 14px 24px;
        border: none; border-radius: 12px;
        font-size: 15px; font-weight: 700;
        cursor: pointer; color: #fff;
        backdrop-filter: blur(6px);
        min-width: 96px;
      }
      .btn--primary  { background: rgba(0, 120, 255, 0.88); }
      .btn--success  { background: rgba(22, 163, 74, 0.88); }
      .btn--danger   { background: rgba(220, 38, 38, 0.88); }
      .btn--neutral  { background: rgba(80, 80, 100, 0.88); }
      .btn:disabled  { opacity: 0.4; pointer-events: none; }

      /* ── Role selector overlay ── */
      #role-screen {
        position: fixed; inset: 0;
        background: rgba(8, 10, 20, 0.96);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 24px; z-index: 30;
        color: #fff;
      }
      #role-screen h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
      #role-screen p  { font-size: 14px; color: #aaa; text-align: center; max-width: 280px; }
      .role-btn {
        width: 240px; padding: 18px;
        border: 2px solid rgba(255,255,255,0.15);
        border-radius: 16px;
        background: rgba(255,255,255,0.06);
        color: #fff; font-size: 17px; font-weight: 700;
        cursor: pointer; text-align: center;
        transition: background 0.2s;
      }
      .role-btn:active { background: rgba(255,255,255,0.14); }
      .role-btn small  { display: block; font-size: 12px; font-weight: 400; color: #aaa; margin-top: 4px; }

      /* ── QR scan prompt ── */
      #qr-screen {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.5);
        display: flex; flex-direction: column;
        align-items: center; justify-content: flex-end;
        padding-bottom: 48px;
        z-index: 25; display: none;
      }
      #qr-frame {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -60%);
        width: 220px; height: 220px;
        border: 3px solid rgba(0, 200, 120, 0.8);
        border-radius: 16px;
        box-shadow: 0 0 0 4000px rgba(0,0,0,0.45);
        z-index: 26; pointer-events: none;
      }
      #qr-label {
        position: fixed; bottom: 80px; left: 50%;
        transform: translateX(-50%);
        color: #fff; font-size: 15px; font-weight: 600;
        background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px;
        z-index: 27;
      }

      /* ── Tag direction arrow (off-screen indicator) ── */
      #tag-arrow {
        position: fixed;
        width: 44px; height: 44px;
        pointer-events: none;
        z-index: 8;
        display: none;
        align-items: center; justify-content: center;
        /* triangle pointing right by default — rotated via JS transform */
        filter: drop-shadow(0 0 4px rgba(0,0,0,0.8));
      }
      #tag-arrow svg { width: 100%; height: 100%; }

      /* ── Crosshair ── */
      #crosshair {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 40px; height: 40px;
        pointer-events: none; z-index: 5;
      }
      #crosshair::before, #crosshair::after {
        content: ''; position: absolute; background: rgba(255,255,255,0.6);
      }
      #crosshair::before { width: 2px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }
      #crosshair::after  { height: 2px; width: 100%; top: 50%; left: 0; transform: translateY(-50%); }
    </style>
  </head>
  <body>

    <!-- Camera + AR layers -->
    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="ar-canvas"></canvas>
    <canvas id="qr-overlay"></canvas>
    <!-- Off-screen tag direction arrow -->
    <div id="tag-arrow">
      <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Arrow pointing right (0°) — rotated via CSS transform -->
        <polygon points="8,10 36,22 8,34" fill="#FFD700" stroke="#000" stroke-width="1.5"/>
        <!-- small circle at tip -->
        <circle cx="36" cy="22" r="4" fill="#FFD700" stroke="#000" stroke-width="1"/>
      </svg>
    </div>

    <div id="crosshair"></div>

    <!-- Status + result -->
    <div id="status">Initialising…</div>
    <div id="result-banner"></div>

    <!-- Role selector -->
    <div id="role-screen">
      <h1>Spatial Tagging</h1>
      <p>Select your role to begin</p>
      <button class="role-btn" id="btn-author">
        Author
        <small>Create &amp; train a tag</small>
      </button>
      <button class="role-btn" id="btn-operator">
        Operator
        <small>Validate a tag</small>
      </button>
    </div>

    <!-- QR scan UI (shown after role selection) -->
    <div id="qr-screen">
      <div id="qr-frame"></div>
      <div id="qr-label">Point camera at asset QR code</div>
    </div>

    <!-- Action bar -->
    <div id="action-bar">
      <button class="btn btn--success" id="btn-place-tag">Place Tag</button>
      <button class="btn btn--primary" id="btn-capture">Capture</button>
      <button class="btn btn--danger"  id="btn-reset">Reset</button>
    </div>

    <!-- ── Prevent iOS Safari pinch / rotate / double-tap zoom ── -->
    <script>
      // iOS fires gesturestart/change/end for multi-finger gestures (pinch/rotate).
      // Preventing them blocks the native page zoom entirely.
      ['gesturestart','gesturechange','gestureend'].forEach(function(t) {
        document.addEventListener(t, function(e) { e.preventDefault(); }, { passive: false });
      });

      // Prevent ctrl+wheel zoom on desktop trackpads.
      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) e.preventDefault();
      }, { passive: false });

      // Prevent double-tap zoom (iOS < 16 and some Android).
      var _lastTap = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - _lastTap < 300 && e.touches.length === 0) e.preventDefault();
        _lastTap = now;
      }, { passive: false });
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
