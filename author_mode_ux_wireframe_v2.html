<style>
.pscr{display:flex;flex-direction:column;height:100%;background:#080810;color:#f0f0f8;font-size:13px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;}
.pnav{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 8px;}
.pback{color:#4f8ef7;font-size:14px;}
.ptitle{font-size:16px;font-weight:500;}
.pact{color:#4f8ef7;font-size:14px;}
.pcard{background:#14141e;border-radius:13px;margin:4px 13px;padding:11px 13px;}
.pbtn{border-radius:13px;margin:5px 13px;padding:13px;text-align:center;font-size:14px;font-weight:500;}
.pbtn.pri{background:#4f8ef7;color:#fff;}
.pbtn.gho{border:1px solid rgba(255,255,255,0.16);color:#f0f0f8;}
.psec{color:rgba(240,240,248,0.38);font-size:10px;letter-spacing:0.6px;padding:10px 16px 3px;}
.ptag-row{display:flex;justify-content:space-between;align-items:center;margin:2px 13px;padding:10px 13px;background:#14141e;border-radius:13px;}
.gbadge{background:rgba(61,214,140,0.14);color:#3dd68c;font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;}
.obadge{background:rgba(245,166,35,0.14);color:#f5a623;font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;}
.bbadge{background:rgba(79,142,247,0.14);color:#4f8ef7;font-size:10px;font-weight:600;padding:3px 7px;border-radius:20px;cursor:pointer;}
.ar-bg{flex:1;background:#090914;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
.qrf{width:110px;height:110px;position:relative;}
.qrf::before,.qrf::after{content:'';position:absolute;width:22px;height:22px;border-color:#3dd68c;border-style:solid;}
.qrf::before{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0;}
.qrf::after{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0;}
.qrf2::before,.qrf2::after{content:'';position:absolute;width:22px;height:22px;border-color:#3dd68c;border-style:solid;}
.qrf2::before{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px;}
.qrf2::after{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0;}
.ring{width:22px;height:22px;border-radius:50%;border:2px solid #4f8ef7;position:absolute;}
.ring.tr{border-color:#3dd68c;}
.ring.hi{border-color:#f5a623;border-width:3px;width:28px;height:28px;}
.ring.dm{border-color:rgba(79,142,247,0.25);}
.xhair-dot{width:8px;height:8px;border-radius:50%;background:#22ddff;position:absolute;}
.xhair-ring{width:36px;height:36px;border-radius:50%;border:1.5px solid #22ddff;position:absolute;}
.sheet{background:#11111c;border-radius:22px 22px 0 0;padding:14px 14px 20px;}
.sh-hdl{width:38px;height:4px;background:rgba(255,255,255,0.18);border-radius:2px;margin:0 auto 14px;}
.step-row{display:flex;align-items:center;gap:0;padding:10px 20px 6px;}
.sdot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex-shrink:0;}
.sdot.act{background:#4f8ef7;color:#fff;}
.sdot.don{background:#3dd68c;color:#fff;}
.sdot.pen{background:#1e1e30;color:rgba(240,240,248,0.35);border:1.5px solid rgba(240,240,248,0.15);}
.sline{flex:1;height:1.5px;}
.sline.act{background:#4f8ef7;}.sline.pen{background:rgba(255,255,255,0.1);}
.inp{background:#1a1a28;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:9px 12px;color:#f0f0f8;font-size:13px;margin:3px 0 6px;width:100%;box-sizing:border-box;}
.inpw{margin:0 13px;}
.flbl{color:rgba(240,240,248,0.45);font-size:10px;letter-spacing:0.5px;margin:8px 13px 2px;}
.qrbox{width:90px;height:90px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;}
</style>

</div>

const TAGS={unchanged:'',revised:'revised',operator:'operator','key screen':'key screen'};
const FNAMES=['Directory','New anchor 1','New anchor 2','Anchor hub','QR gate','AR placement','Tag details','Tag list','Tag navigation','Operator mode'];

let cur=0;

function render(){
  const s=SC[cur];
  document.getElementById('snum').textContent=cur+1;
  document.getElementById('slbl').textContent=s.title;
  document.getElementById('pscreen').innerHTML=s.html;
  document.getElementById('bprev').disabled=cur===0;
  document.getElementById('bnext').disabled=cur===SC.length-1;

  const tagColors={revised:'var(--color-background-warning)',operator:'var(--color-background-info)','key screen':'var(--color-background-success)'};
  const tagTextColors={revised:'var(--color-text-warning)',operator:'var(--color-text-info)','key screen':'var(--color-text-success)'};
  const tagBadge=s.tag&&s.tag!=='unchanged'?`<span style="background:${tagColors[s.tag]};color:${tagTextColors[s.tag]};font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;margin-left:8px;">${s.tag}</span>`:'';

  const notes=s.notes.map(([ic,txt])=>`
    <div style="display:flex;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--color-border-tertiary);">
      <i class="ti ti-${ic}" style="font-size:16px;color:var(--color-text-secondary);flex-shrink:0;margin-top:1px;" aria-hidden="true"></i>
      <span style="font-size:13px;color:var(--color-text-primary);line-height:1.5;">${txt}</span>
    </div>`).join('');

  document.getElementById('apanel').innerHTML=`
    <div style="background:var(--color-background-primary);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);padding:1rem 1.25rem;">
      <p style="font-size:12px;color:var(--color-text-tertiary);font-weight:500;letter-spacing:0.4px;margin:0 0 3px;">SCREEN ${cur+1} OF 10</p>
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:3px;">
        <h3 style="font-size:18px;font-weight:500;margin:0;color:var(--color-text-primary);">${s.title}</h3>${tagBadge}
      </div>
      <p style="font-size:13px;color:var(--color-text-secondary);margin:0 0 14px;">${s.sub}</p>
      ${notes}
      ${s.why?`<div style="margin-top:12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;border-left:3px solid var(--color-border-info);">
        <p style="font-size:12px;color:var(--color-text-secondary);margin:0 0 2px;font-weight:500;">Design rationale</p>
        <p style="font-size:13px;color:var(--color-text-primary);margin:0;line-height:1.5;">${s.why}</p>
      </div>`:''}
      <div style="margin-top:12px;">
        <p style="font-size:12px;color:var(--color-text-tertiary);margin:0 0 4px;font-weight:500;">FLOW PATH</p>
        <p style="font-size:12px;color:var(--color-text-secondary);margin:0;line-height:1.6;">${s.flow}</p>
      </div>
    </div>`;

  document.getElementById('fcrumb').innerHTML=FNAMES.map((n,i)=>{
    const active=i===cur;
    const parts=[`<span onclick="go(${i})" style="cursor:pointer;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;${active?'background:var(--color-background-info);color:var(--color-text-info);font-weight:500;':'color:var(--color-text-tertiary);'}">${n}</span>`];
    if(i<FNAMES.length-1) parts.push(`<span style="color:var(--color-text-tertiary);font-size:11px;">›</span>`);
    return parts.join('');
  }).join('');
}
function nS(){if(cur<SC.length-1){cur++;render();}}
function pS(){if(cur>0){cur--;render();}}
function go(i){cur=i;render();}
render();
</script>
