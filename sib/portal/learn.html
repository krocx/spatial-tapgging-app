<!DOCTYPE html>
<html lang="en" class="ax">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn · appliedx Connected Worker AR OMS Platform</title>
<link rel="stylesheet" href="/portal/brand/brand.css">
<style>
  /* /learn - six five-minute reads over the Feature Catalogue. One journey answers
     one question; one stop is one screen: a line, a diagram, three sentences.
     Built only from the brand system (docs/BRAND.md → Portal patterns). */
  body { margin: 0; }
  .ln-header { display: flex; align-items: center; gap: var(--ax-s4); padding: var(--ax-s4) var(--ax-s5); border-bottom: var(--ax-hair); }
  .ln-header .ax-nav { margin-left: var(--ax-s4); }
  .ln-header .ax-chip { margin-left: auto; }
  .ln-wrap { max-width: 1120px; margin: 0 auto; padding: var(--ax-s6) var(--ax-s5) var(--ax-s7); }

  /* Landing */
  .ln-hero h1 { margin: 0 0 var(--ax-s2); }
  .ln-hero p  { color: var(--ax-ink-2); margin: 0 0 var(--ax-s6); }
  .ln-doors { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--ax-s4); }
  .ln-door { text-align: left; border: 1px solid color-mix(in srgb, var(--ax-pc, var(--ax-blue)) 30%, transparent); }
  .ln-door .ln-ring { flex: none; width: 44px; height: 44px; }
  .ln-door .ln-ring circle { fill: none; stroke-width: 3; }
  .ln-door .ln-ring .bg { stroke: var(--ax-paper-3); }
  .ln-door .ln-ring .fg { stroke: var(--ax-pc, var(--ax-blue)); stroke-linecap: round; transition: stroke-dashoffset var(--ax-t-slow) var(--ax-ease); }
  .ln-door .ln-ring .ax-icon { color: var(--ax-pc, var(--ax-blue)); }
  .ln-door b { font: var(--ax-h3); font-size: 17px; line-height: 22px; display: block; }
  .ln-door span { display: block; font: var(--ax-label-s); color: var(--ax-ink-3); }
  .ln-door .ln-q { color: var(--ax-ink-2); margin-top: 4px; }
  .ln-door .ln-meta { margin-top: 6px; }
  .ln-door.is-done { border-color: color-mix(in srgb, var(--ax-green) 50%, transparent); }

  /* Journey */
  .ln-top { display: flex; align-items: center; gap: var(--ax-s3); margin-bottom: var(--ax-s5); }
  .ln-top .ln-name { font: var(--ax-label); }
  .ln-marks { display: flex; gap: 10px; margin-left: auto; align-items: center; }
  .ln-marks .ax-mark { font-size: 14px; color: var(--ax-ink-4); cursor: pointer; }
  .ln-marks .ax-mark.is-passed { color: var(--ax-green); }
  .ln-marks .ax-mark.is-now { color: var(--ax-blue); }
  .ln-stop { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--ax-s5); align-items: start; }
  .ln-copy .ax-eyebrow { margin-bottom: var(--ax-s2); }
  .ln-copy h1 { margin: 0 0 var(--ax-s3); font: var(--ax-h2); font-size: 28px; line-height: 36px; }
  .ln-copy p  { font: var(--ax-label-r); color: var(--ax-ink-2); max-width: none; }
  .ln-copy .ax-notice { margin-top: var(--ax-s4); }
  .ln-copy .ln-more { display: inline-flex; align-items: center; gap: 6px; margin-top: var(--ax-s4); }
  .ln-diagram { padding: var(--ax-s4); min-height: 280px; display: flex; align-items: center; justify-content: center; overflow: auto; }
  .ln-diagram svg { max-width: 100%; height: auto; }
  .ln-diagram pre { font: var(--ax-num); color: var(--ax-ink-3); white-space: pre-wrap; margin: 0; }
  .ln-nav { display: flex; gap: var(--ax-s3); margin-top: var(--ax-s5); align-items: center; }
  .ln-nav .ln-hint { margin-left: auto; color: var(--ax-ink-4); font: var(--ax-label-s); }

  /* Quiz */
  .ln-quiz h1 { margin: 0 0 var(--ax-s2); font: var(--ax-h2); }
  .ln-quiz p.lead { color: var(--ax-ink-2); margin-bottom: var(--ax-s5); }
  .ln-q { margin-bottom: var(--ax-s4); }
  .ln-q .ln-qt { font: var(--ax-label); margin-bottom: var(--ax-s2); }
  .ln-q .ln-opts { display: flex; flex-direction: column; gap: 6px; }
  .ln-q .ln-opt { text-align: left; justify-content: flex-start; }
  .ln-q .ln-opt.is-right { background: var(--ax-ok-fill); color: var(--ax-green); }
  .ln-q .ln-opt.is-wrong { background: var(--ax-bad-fill); color: var(--ax-red); }
  .ln-done { text-align: center; padding: var(--ax-s7) var(--ax-s4); }
  .ln-done .ax-mark { font-size: 56px; display: block; margin: 0 auto var(--ax-s4); }
  .ln-done h1 { margin: 0 0 var(--ax-s2); }
  .ln-done p  { color: var(--ax-ink-2); margin: 0 auto var(--ax-s5); }

  @media (max-width: 860px) {
    .ln-stop { grid-template-columns: 1fr; }
    .ln-marks { display: none; }
  }
</style>
</head>
<body>
<header class="ln-header">
  <span class="ax-wordmark"><span class="ax-a">applied</span><span class="ax-x">x</span><span class="ax-rest">Connected Worker AR OMS Platform</span></span>
  <nav class="ax-nav"><a href="/">Home</a><a href="/learn" aria-current="page">Learn</a><a href="/catalog">Catalogue</a><a href="/platform">Platform</a></nav>
  <span class="ax-chip" id="ln-version"></span>
  <span data-brand-slot style="display:flex;align-items:center;margin-left:12px"></span>
</header>

<main class="ln-wrap" id="ln-main">
  <div class="ax-empty" style="border:0"><span class="ax-mark is-loading"><i></i><em></em></span>Loading…</div>
</main>

<script src="/portal/brand.js"></script>
<script>
// ── State ────────────────────────────────────────────────────────────────────
let DATA = null;                       // /learn/data
let journey = null;                    // the open journey
let stop = 0;                          // index into journey.stops, or stops.length = quiz
const KEY = id => 'ax-learn:' + id;
const prog = id => { try { return JSON.parse(localStorage.getItem(KEY(id)) || '{}'); } catch { return {}; } };
const save = (id, p) => { try { localStorage.setItem(KEY(id), JSON.stringify(p)); } catch { /* private mode */ } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const icon = n => `<svg class="ax-icon"><use href="/portal/brand/icons.svg#i-${n}"/></svg>`;
const AREA_ICON = { tags: 'qr', guides: 'steps', iloto: 'lockout', gemba: 'checklist', designer: 'procedure', portal: 'home', platform: 'chip' };

// ── Boot ─────────────────────────────────────────────────────────────────────
(async function () {
  try {
    const r = await fetch('/learn/data'); if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
    document.getElementById('ln-version').textContent = 'v' + (DATA.version || '');
    loadMermaid();
    route();
  } catch (e) {
    document.getElementById('ln-main').innerHTML = `<div class="ax-notice ax-notice--bad">${icon('alert')}<div>Learn isn't available on this deployment - ${esc(e.message)}</div></div>`;
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', e => {
    if (!journey) return;
    if (e.key === 'ArrowRight') go(stop + 1);
    if (e.key === 'ArrowLeft')  go(stop - 1);
    if (e.key === 'Escape')     location.hash = '';
  });
})();

function route() {
  const m = location.hash.match(/^#([\w-]+)(?:\/(\d+))?$/);
  if (m && DATA.journeys.some(j => j.id === m[1])) {
    journey = DATA.journeys.find(j => j.id === m[1]);
    stop = Math.max(0, Math.min(journey.stops.length, Number(m[2] ?? prog(journey.id).stop ?? 0)));
    renderStop(true);
  } else { journey = null; renderLanding(); }
  window.scrollTo(0, 0);
}
function go(i) {
  if (!journey) return;
  i = Math.max(0, Math.min(journey.stops.length, i));
  const p = prog(journey.id); p.stop = i; p.reached = Math.max(p.reached || 0, i); save(journey.id, p);
  location.hash = `#${journey.id}/${i}`;
}

// ── Landing: six doors ───────────────────────────────────────────────────────
function renderLanding() {
  const doors = DATA.journeys.map(j => {
    const p = prog(j.id); const n = j.stops.length;
    const done = !!p.done; const frac = done ? 1 : Math.min(1, (p.reached || 0) / n);
    const C = 2 * Math.PI * 19;
    return `<a class="ax-door ln-door${done ? ' is-done' : ''}" data-product="${j.area}" href="#${j.id}">
      <svg class="ln-ring" viewBox="0 0 44 44" aria-hidden="true">
        <circle class="bg" cx="22" cy="22" r="19"/>
        <circle class="fg" cx="22" cy="22" r="19" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}" transform="rotate(-90 22 22)"/>
        <svg class="ax-icon" x="13" y="13" width="18" height="18"><use href="/portal/brand/icons.svg#i-${done ? 'check' : (AREA_ICON[j.area] || 'doc')}"/></svg>
      </svg>
      <div style="min-width:0">
        <b>${esc(j.name)}</b>
        <span class="ln-q">${esc(j.question)}</span>
        <span class="ln-meta">${done ? `Done · ${p.score}/3 right` : (p.reached ? `${p.reached} of ${n} stops` : `${j.minutes} min · ${n} stops`)}</span>
      </div>
      <span class="ax-chev">${icon('chevron')}</span>
    </a>`;
  }).join('');
  const total = DATA.journeys.length, doneN = DATA.journeys.filter(j => prog(j.id).done).length;
  document.getElementById('ln-main').innerHTML = `<div class="ln-hero">
      <div class="ax-eyebrow">Learn</div>
      <h1>Welcome to the Connected Worker platform.</h1>
      <p>It puts the right instruction, check and record exactly where the work happens, on the equipment itself, so people on the floor are guided, proven and protected without paperwork. These six short journeys explain how, in the order you would meet it: five minutes each, one idea per screen, the platform's own diagrams, and the Catalogue a click away for the detail.${doneN ? ` <b>${doneN} of ${total} done.</b>` : ''}</p>
    </div>
    <div class="ln-doors">${doors}</div>`;
}

// ── One stop ─────────────────────────────────────────────────────────────────
function renderStop(arriving) {
  const n = journey.stops.length;
  if (stop >= n) return renderQuiz();
  const s = journey.stops[stop];
  const p = prog(journey.id);
  const marks = journey.stops.map((_, i) => `<span class="ax-mark${i < stop ? ' is-passed' : ''}${i === stop ? ' is-now ax-lockin' : ''}" title="Stop ${i + 1}" onclick="go(${i})"><i></i><em></em></span>`).join('')
    + `<span class="ax-mark${p.done ? ' is-passed' : ''}" title="Check what stuck" onclick="go(${n})"><i></i><em></em></span>`;
  document.getElementById('ln-main').innerHTML = `
    <div class="ln-top" data-product="${journey.area}">
      <a class="ax-btn ax-btn--quiet ax-btn--sm" href="#">${icon('back')} All journeys</a>
      <span class="ln-name">${esc(journey.name)}</span>
      <div class="ln-marks">${marks}</div>
    </div>
    <div class="ln-stop${arriving ? ' ax-lockin' : ''}" data-product="${s.area}">
      <div class="ln-copy">
        <div class="ax-eyebrow">Stop ${stop + 1} of ${n} · ${esc(s.name)}</div>
        <h1>${esc(s.title)}</h1>
        <p>${esc(s.text)}</p>
        ${s.try ? `<div class="ax-notice">${icon('bolt')}<div><b>Try it now</b><br>${esc(s.try)}</div></div>` : ''}
        ${s.locked ? `<div class="ax-notice ax-notice--warn">${icon('lock-restricted')}<div>This feature's detail is restricted - unlock the Catalogue with the IP key to see its diagram.</div></div>` : ''}
        <a class="ln-more" href="${esc(s.catalog)}">Read more in the Catalogue ${icon('next')}</a>
      </div>
      <div class="ax-card ax-diagram ln-diagram" id="ln-diagram">${s.diagram ? '' : '<span class="ax-muted">No diagram for this stop yet.</span>'}</div>
    </div>
    <div class="ln-nav">
      <button class="ax-btn" onclick="go(${stop - 1})" ${stop === 0 ? 'disabled' : ''}>${icon('back')} Back</button>
      <button class="ax-btn ax-btn--primary" onclick="go(${stop + 1})">${stop === n - 1 ? 'Check what stuck' : 'Next'} ${icon('next')}</button>
      <span class="ln-hint">← → to move · Esc for all journeys</span>
    </div>`;
  if (s.diagram) drawDiagram(s.diagram, s.area);
}

// ── Quiz - recognition, not memory: three questions, immediate feedback ──────
let answers = [];
function renderQuiz() {
  answers = journey.quiz.map(() => null);
  const qs = journey.quiz.map((q, qi) => `<div class="ln-q" id="ln-q${qi}">
      <div class="ln-qt">${qi + 1}. ${esc(q.q)}</div>
      <div class="ln-opts">${q.options.map((o, oi) => `<button class="ax-btn ln-opt" onclick="answer(${qi},${oi})">${esc(o)}</button>`).join('')}</div>
    </div>`).join('');
  const marks = journey.stops.map((_, i) => `<span class="ax-mark is-passed" onclick="go(${i})"><i></i><em></em></span>`).join('') + `<span class="ax-mark is-now"><i></i><em></em></span>`;
  document.getElementById('ln-main').innerHTML = `
    <div class="ln-top" data-product="${journey.area}">
      <a class="ax-btn ax-btn--quiet ax-btn--sm" href="#">${icon('back')} All journeys</a>
      <span class="ln-name">${esc(journey.name)}</span>
      <div class="ln-marks">${marks}</div>
    </div>
    <div class="ln-quiz ax-lockin">
      <h1>What stuck?</h1>
      <p class="lead">Three questions; each answer tells you straight away. Nothing is recorded anywhere but this browser.</p>
      ${qs}
      <div id="ln-quiz-end"></div>
    </div>`;
}
function answer(qi, oi) {
  if (answers[qi] !== null) return;
  answers[qi] = oi;
  const q = journey.quiz[qi];
  const el = document.getElementById('ln-q' + qi);
  el.querySelectorAll('.ln-opt').forEach((b, i) => {
    b.disabled = true;
    if (i === q.answer) b.classList.add('is-right');
    else if (i === oi) b.classList.add('is-wrong');
  });
  if (answers.every(a => a !== null)) {
    const score = answers.filter((a, i) => a === journey.quiz[i].answer).length;
    const p = prog(journey.id); p.done = true; p.score = score; p.stop = 0; save(journey.id, p);
    const next = DATA.journeys.find(j => !prog(j.id).done);
    document.getElementById('ln-quiz-end').innerHTML = `<div class="ln-done ax-lockin">
        <span class="ax-mark ${score === 3 ? 'is-green' : ''}"><i></i><em></em></span>
        <h1>${score === 3 ? 'All three.' : score + ' of 3.'}</h1>
        <p>${score === 3 ? 'You could explain this one to someone else now.' : 'Worth a second pass on the stops you missed - the marks above take you straight there.'}</p>
        <div class="ax-row" style="justify-content:center">
          ${next ? `<a class="ax-btn ax-btn--primary" href="#${next.id}">Next: ${esc(next.name)} ${icon('next')}</a>` : `<a class="ax-btn ax-btn--primary" href="#">All six done - back to Learn ${icon('next')}</a>`}
          <a class="ax-btn" href="/catalog">Open the Catalogue</a>
        </div>
      </div>`;
    document.getElementById('ln-quiz-end').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// ── Diagrams - Mermaid, vendored, themed from the tokens at runtime ──────────
let mermaidReady = false, seq = 0;
function loadMermaid() {
  const s = document.createElement('script');
  s.src = '/portal/vendor/mermaid.min.js';
  s.onload = () => { mermaidReady = true; if (journey && stop < journey.stops.length) drawDiagram(journey.stops[stop].diagram, journey.stops[stop].area); };
  document.head.appendChild(s);
}
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
async function drawDiagram(code, area) {
  const el = document.getElementById('ln-diagram'); if (!el || !code) return;
  if (!mermaidReady) { el.innerHTML = `<pre>${esc(code)}</pre>`; return; }
  const pc = cssVar('--ax-p-' + area) || cssVar('--ax-blue');
  const accent = pc.startsWith('var(') ? cssVar(pc.slice(4, -1)) : pc;
  const solid = cssVar('--ax-solid'), ink = cssVar('--ax-ink'), ink2 = cssVar('--ax-ink-2'), bg2 = cssVar('--ax-bg-2');
  try {
    window.mermaid.initialize({ startOnLoad: false, theme: 'base', securityLevel: 'loose', suppressErrorRendering: true,
      themeVariables: { darkMode: true, background: solid, fontFamily: cssVar('--ax-font'), fontSize: '14px',
        primaryColor: bg2, primaryBorderColor: accent, primaryTextColor: ink, lineColor: ink2, textColor: ink,
        secondaryColor: bg2, secondaryBorderColor: accent, tertiaryColor: solid, tertiaryBorderColor: accent,
        mainBkg: bg2, nodeBorder: accent, clusterBkg: solid, clusterBorder: accent, edgeLabelBackground: solid, titleColor: ink,
        actorBkg: bg2, actorBorder: accent, actorTextColor: ink, actorLineColor: ink2, signalColor: ink, signalTextColor: ink,
        labelBoxBkgColor: bg2, labelBoxBorderColor: accent, labelTextColor: ink, loopTextColor: ink, noteBkgColor: bg2, noteBorderColor: accent, noteTextColor: ink,
        activationBkgColor: bg2, activationBorderColor: accent } });
    const { svg } = await window.mermaid.render('ln' + (++seq), code);
    el.innerHTML = svg;
  } catch { el.innerHTML = `<pre>${esc(code)}</pre>`; }
}
</script>
</body>
</html>
