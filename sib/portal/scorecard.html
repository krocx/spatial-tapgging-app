<!DOCTYPE html>
<html lang="en" class="ax">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorecard · appliedx Connected Worker AR OMS Platform</title>
<link rel="stylesheet" href="/portal/brand/brand.css">
<style>
  /* /scorecard - the Technology Readiness scorecard SIB keeps for its tracks
     (docs/TRL-SCORECARD.md): the team scores criteria with evidence, the
     track owner confirms the lens, the Overview shows where every track stands.
     Built only from the brand system. */
  body { margin: 0; }
  .sc-header { display: flex; align-items: center; gap: var(--ax-s4); padding: var(--ax-s4) var(--ax-s5); border-bottom: var(--ax-hair); }
  .sc-header .ax-nav { margin-left: var(--ax-s4); }
  .sc-header .ax-chip { margin-left: auto; }
  .sc-wrap { max-width: 1320px; margin: 0 auto; padding: var(--ax-s5) var(--ax-s5) var(--ax-s7); }
  .sc-hero { display: flex; align-items: flex-end; gap: var(--ax-s4); flex-wrap: wrap; margin-bottom: var(--ax-s4); }
  .sc-hero h1 { margin: 0; }
  .sc-hero p { color: var(--ax-ink-2); margin: 4px 0 0; max-width: 820px; }
  .sc-hero .sc-tools { margin-left: auto; display: flex; gap: var(--ax-s2); align-items: center; }
  .ax-tabs { margin-bottom: var(--ax-s4); flex-wrap: wrap; }
  /* Overview */
  .ld-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: var(--ax-s4); }
  .ld-card { border-left: 3px solid var(--ax-pc, var(--ax-blue)); }
  .ld-card h2 { margin: 0 0 2px; font: var(--ax-h3); }
  .ld-card .ld-verdict { font: var(--ax-h2); font-size: 26px; line-height: 30px; margin: 6px 0 2px; }
  .ld-card .ld-meta { font: var(--ax-label-s); color: var(--ax-ink-3); }
  .ld-lens { display: grid; grid-template-columns: 1fr 1fr; gap: var(--ax-s3); margin-top: var(--ax-s3); }
  .ld-lens .ax-tile { padding: 10px 12px; }
  .ld-lens .ax-tile b { font: var(--ax-h2); font-size: 28px; line-height: 32px; font-family: var(--ax-mono); }
  .ld-lens .ax-tile span { display: block; font: var(--ax-label-s); color: var(--ax-ink-3); }
  .ld-gaps { margin-top: var(--ax-s3); font: var(--ax-label-s); color: var(--ax-ink-2); }
  .ld-gaps b { color: var(--ax-orange); }
  .ld-strip { display: flex; gap: var(--ax-s3); flex-wrap: wrap; margin-bottom: var(--ax-s4); }
  .ld-strip .ax-tile { flex: 1 1 180px; padding: 10px 12px; }
  .ld-strip .ax-tile b { font: var(--ax-h2); font-size: 24px; font-family: var(--ax-mono); }
  .ld-strip .ax-tile span { display: block; font: var(--ax-label-s); color: var(--ax-ink-3); }
  .v-ADVANCE { color: var(--ax-green); } .v-CONTINUE { color: var(--ax-orange); } .v-PARK { color: var(--ax-orange); } .v-CLOSE { color: var(--ax-red); } .v-none { color: var(--ax-ink-3); }
  /* Track */
  .tr-top { display: grid; grid-template-columns: 1fr 1fr; gap: var(--ax-s4); margin-bottom: var(--ax-s4); }
  .tr-lens h3 { margin: 0 0 4px; font: var(--ax-h3); }
  .tr-lens .big { font: var(--ax-h2); font-size: 34px; line-height: 38px; font-family: var(--ax-mono); }
  .tr-lens .rule { font: var(--ax-label-s); color: var(--ax-ink-3); margin-top: 4px; }
  .tr-lens form { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: var(--ax-s3); }
  .tr-table td, .tr-table th { vertical-align: top; }
  .tr-table .crit b { display: block; }
  .tr-table .crit span { display: block; font: var(--ax-label-s); color: var(--ax-ink-3); }
  .rb h3 { margin: var(--ax-s3) 0 4px; font: var(--ax-h3); }
  .rb p { margin: 0 0 6px; color: var(--ax-ink-2); }
  .rb .ax-table td:first-child { font-family: var(--ax-mono); font-weight: 700; white-space: nowrap; }
  .tr-table .score { font-family: var(--ax-mono); font-size: 18px; font-weight: 700; text-align: center; width: 48px; }
  .s1, .s2 { color: var(--ax-red); } .s3 { color: var(--ax-orange); } .s4, .s5 { color: var(--ax-green); }
  .tr-table .ev a { font: var(--ax-label-s); }
  /* Entry form */
  .sc-form { display: grid; grid-template-columns: 1fr; gap: var(--ax-s3); }
  .sc-form .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .sc-form .levels label { border: var(--ax-hair); border-radius: var(--ax-r-field); padding: 8px; cursor: pointer; font: var(--ax-label-s); color: var(--ax-ink-2); }
  .sc-form .levels label b { display: block; font-family: var(--ax-mono); font-size: 16px; color: var(--ax-ink); }
  .sc-form .levels input { margin-right: 4px; }
  .sc-form .levels label.on { border-color: var(--ax-blue); background: var(--ax-blue-fill); }
  .sc-form .levels + .hint { margin-top: -4px; }
  .sc-form .step { border-top: var(--ax-hair); padding-top: var(--ax-s3); }
  .sc-form .step > .q { font: var(--ax-label); color: var(--ax-ink); margin: 0 0 6px; }
  .sc-form .step > .q b { font-family: var(--ax-mono); color: var(--ax-blue); margin-right: 6px; }
  .sc-form .hint { font: var(--ax-label-s); color: var(--ax-ink-3); }
  .sc-form .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .sc-form .chips label { border: var(--ax-hair); border-radius: var(--ax-r-field); padding: 6px 10px; cursor: pointer; font: var(--ax-label-s); color: var(--ax-ink-2); flex: 1 1 180px; }
  .sc-form .chips label b { display: block; color: var(--ax-ink); }
  .sc-form .chips label.on { border-color: var(--ax-blue); background: var(--ax-blue-fill); }
  .sc-form .chips input { position: absolute; opacity: 0; width: 0; height: 0; }
  .sc-form .where { display: grid; grid-template-columns: 1fr 1fr; gap: var(--ax-s3); }
  .sc-form .where label { display: block; font: var(--ax-label-s); color: var(--ax-ink-3); }
  .sc-form .where .ax-select { width: 100%; margin-top: 4px; }
  .sc-form .ev-row { display: grid; grid-template-columns: 130px 1fr 1fr 32px; gap: 6px; align-items: center; margin-top: 6px; }
  .sc-form .ev-row .ax-input, .sc-form .ev-row .ax-select { width: 100%; min-width: 0; }
  .sc-form .ev-row .x { background: none; border: 0; color: var(--ax-ink-3); cursor: pointer; padding: 0; display: flex; }
  .sc-form .ev-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .sc-form .ev-quick .ax-btn { font: var(--ax-label-s); padding: 4px 10px; }
  .sc-form .ev-quick .ax-btn.added { color: var(--ax-green); border-color: var(--ax-green); }
  .sc-form .step.needs { border-top-color: var(--ax-orange); }
  .sc-form .step.needs > .q::after { content: ' · a 4 or 5 needs at least one'; color: var(--ax-orange); font: var(--ax-label-s); }
  .sc-form .ax-textarea { width: 100%; box-sizing: border-box; }
  .sc-form .row { display: flex; gap: var(--ax-s3); align-items: center; flex-wrap: wrap; }
  .sc-form .row .as { font: var(--ax-label-s); color: var(--ax-ink-3); }
  .sc-howto { display: flex; gap: var(--ax-s4); align-items: flex-start; flex-wrap: wrap; margin-bottom: var(--ax-s4); }
  .sc-howto .st { flex: 1 1 200px; font: var(--ax-label-s); color: var(--ax-ink-2); }
  .sc-howto .st b { display: block; color: var(--ax-ink); font-family: var(--ax-mono); }
  .sc-howto .st b::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ax-blue); margin-right: 8px; }
  .hist-tools { display: flex; gap: var(--ax-s3); align-items: center; margin-bottom: var(--ax-s3); flex-wrap: wrap; }
  /* Business Readiness / Impact (docs/BUSINESS-READINESS.md) */
  .sc-seg { display: inline-flex; flex: 0 0 auto; border: var(--ax-hair); border-radius: var(--ax-r-cta); overflow: hidden; background: var(--ax-paper); }
  .sc-seg button { border: 0; background: transparent; color: var(--ax-ink-2); font: var(--ax-label); padding: 8px 16px; cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
  .sc-hero .sc-tools > * { flex: 0 0 auto; }
  .sc-seg button.is-on { background: var(--ax-blue); color: var(--ax-on-accent); }
  .bi-top { display: grid; grid-template-columns: 1.2fr 3fr; gap: var(--ax-s4); margin-bottom: var(--ax-s4); }
  .bi-overall .big { font: var(--ax-h2); font-size: 40px; line-height: 44px; font-family: var(--ax-mono); }
  .bi-pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--ax-s4); }
  .bi-pillar { border-top: 3px solid var(--ax-pc); }
  .bi-pillar h2 { margin: 0; font: var(--ax-h3); }
  .bi-pillar .q { font: var(--ax-label-s); color: var(--ax-ink-3); margin: 2px 0 6px; }
  .bi-gauge { display: block; width: 100%; height: auto; }
  .bi-level { font: var(--ax-h2); font-size: 22px; line-height: 26px; }
  .bi-word { font: var(--ax-label-s); color: var(--ax-ink-2); }
  .bi-table td, .bi-table th { vertical-align: top; }
  .bi-table .m b { display: block; } .bi-table .m span { display: block; font: var(--ax-label-s); color: var(--ax-ink-3); }
  .bi-table .n { font-family: var(--ax-mono); text-align: right; white-space: nowrap; }
  .bi-bar { position: relative; height: 6px; border-radius: 3px; background: var(--ax-paper-3); min-width: 120px; }
  .bi-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--ax-pc, var(--ax-blue)); }
  .bi-bar em { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--ax-ink-3); }
  .bi-claims .ax-table td { vertical-align: top; }
  .bi-section { border-left: 3px solid var(--ax-pc); margin-top: var(--ax-s4); }
  .bi-section .bi-head { display: grid; grid-template-columns: 200px 1fr auto; gap: var(--ax-s4); align-items: center; }
  .bi-section .bi-head h2 { margin: 0; font: var(--ax-h3); }
  .bi-section .bi-head .q { font: var(--ax-label-s); color: var(--ax-ink-3); }
  .bi-section .bi-gauge { width: 200px; }
  .bi-needles { margin-top: var(--ax-s3); }
  .bi-needles td.m { min-width: 220px; } .bi-needles td.m b { display: block; } .bi-needles td.m span { display: block; font: var(--ax-label-s); color: var(--ax-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
  .bi-needles td.n { font-family: var(--ax-mono); text-align: right; white-space: nowrap; }
  .bi-needles td.act { white-space: nowrap; }
  .bi-visuals { display: grid; grid-template-columns: 1.4fr 1fr; gap: var(--ax-s4); margin-top: var(--ax-s4); }
  .bi-contrib svg { display: block; width: 100%; height: auto; }
  .bi-risk { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: start; padding: 8px 0; border-top: var(--ax-hair); }
  .bi-risk:first-of-type { border-top: 0; }
  .bi-risk .sev { font: var(--ax-label-s); padding: 2px 8px; border-radius: 100px; white-space: nowrap; }
  .sev-high { background: var(--ax-bad-fill); color: var(--ax-red); } .sev-medium { background: var(--ax-warn-fill); color: var(--ax-orange); } .sev-low { background: var(--ax-paper-3); color: var(--ax-ink-2); }
  .bi-wiz .wstep { display: none; } .bi-wiz .wstep.is-on { display: block; }
  .bi-wiz .wprog { display: flex; gap: 4px; margin: 8px 0 14px; } .bi-wiz .wprog i { flex: 1; height: 4px; border-radius: 2px; background: var(--ax-paper-3); } .bi-wiz .wprog i.done { background: var(--ax-green); } .bi-wiz .wprog i.on { background: var(--ax-blue); }
  .bi-wiz .why { background: var(--ax-paper); border-radius: var(--ax-r-field); padding: 10px 12px; margin: 8px 0 12px; font: var(--ax-label-s); color: var(--ax-ink-2); }
  .bi-wiz .why b { color: var(--ax-ink); }
  .bi-wiz .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .spark { vertical-align: middle; }
  @media (max-width: 980px) { .bi-visuals, .bi-section .bi-head, .bi-wiz .grid2 { grid-template-columns: 1fr; } }
  .bi-todo { display: flex; flex-wrap: wrap; gap: 6px; }
  .up { color: var(--ax-green); } .down { color: var(--ax-red); } .flat { color: var(--ax-ink-3); }
  @media (max-width: 980px) { .bi-top, .bi-pillars { grid-template-columns: 1fr; } }
  .sc-modal { position: fixed; inset: 0; background: var(--ax-scrim); z-index: 9100; display: none; align-items: center; justify-content: center; }
  .sc-modal.open { display: flex; }
  .sc-modal .ax-card { background: var(--ax-solid); width: min(760px, 94vw); max-height: 90vh; overflow: auto; position: relative; }
  .hist li { font: var(--ax-label-s); color: var(--ax-ink-2); padding: 4px 0; border-bottom: var(--ax-hair); }
  @media (max-width: 900px) { .tr-top { grid-template-columns: 1fr; } .sc-form .levels { grid-template-columns: 1fr; } .sc-form .where { grid-template-columns: 1fr; } .sc-form .ev-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="sc-header">
  <span class="ax-wordmark"><span class="ax-a">applied</span><span class="ax-x">x</span><span class="ax-rest">Connected Worker AR OMS Platform</span></span>
  <nav class="ax-nav"><a href="/">Home</a><a href="/platform">Platform map</a><a href="/devices/gallery">Devices</a><a href="/portfolio">POC Portfolio</a><a href="/catalog">Catalogue</a><a href="/scorecard" aria-current="page">Scorecard</a></nav>
  <span class="ax-chip" id="sc-version"></span>
  <span class="ax-chip" id="sc-me" style="margin-left:8px" title="Every score, lens and verdict is saved under this name"></span>
  <span data-brand-slot style="display:flex;align-items:center;margin-left:12px"></span>
</header>

<main class="sc-wrap" id="sc-main">
  <div class="ax-empty" style="border:0"><span class="ax-mark is-loading"><i></i><em></em></span>Loading…</div>
</main>
<div class="sc-modal" id="sc-modal"></div>

<script src="/portal/brand.js"></script>
<script>
const main = document.getElementById('sc-main');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const apiKey = () => localStorage.getItem('sib_api_key') || '';
async function api(path, init = {}) {
  const r = await fetch(path, { ...init, headers: { ...(apiKey() ? { 'X-API-Key': apiKey() } : {}), ...(init.body ? { 'Content-Type': 'application/json' } : {}), ...(init.headers || {}) } });
  if (!r.ok) { let e = r.statusText; try { e = (await r.json()).error || e; } catch {} throw new Error(e); }
  return r.json();
}
function toast(msg) { let t = document.getElementById('sc-toast'); if (!t) { t = document.createElement('div'); t.id = 'sc-toast'; t.className = 'ax-notice'; t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9200;max-width:90vw'; document.body.appendChild(t); } t.textContent = msg; t.style.display = 'flex'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500); }

let DATA = null, quarter = null, tab = 'transition';
let segment = 'tech';            // 'tech' | 'business' - the two halves of the scorecard
let IMPACT = null;               // /scorecard/impact for the quarter
const WORDS = { 1: 'Concept', 2: 'Demo only', 3: 'Controlled', 4: 'In situ', 5: 'Proven' };
const VERDICT_TEXT = { ADVANCE: 'Advance', CONTINUE: 'Continue', PARK: 'Parked', CLOSE: 'Closed' };
const COLOR = { 'content-pipeline': 'var(--ax-green)', 'hardware-fit': 'var(--ax-blue)', 'ar-sdk': 'var(--ax-teal)' };
const roleWord = r => ({ owner: 'Owner', manager: 'Manager', engineer: 'Engineer', technician: 'Technician' }[r] || r);
const CONF_TEXT = { High: 'repeated on real content or devices; someone else could reproduce it', Medium: 'more than once in a controlled setting', Low: 'once, a demo, or hearsay (counts as 3 at most on the master sheet)' };
const WHO_SCORES = 'Scoring is for Engineers and above, signed in by name; lens confirmation and the verdict are for Managers and above.';
let GUIDES = null;
async function guides() { if (!GUIDES) { try { GUIDES = (await api('/scorecard/guides')).data; } catch { GUIDES = []; } } return GUIDES; }
const seenHowto = () => { try { return localStorage.getItem('sib_scorecard_howto') === '1'; } catch { return false; } };

async function load(q) {
  const r = await api('/scorecard/data' + (q ? `?quarter=${encodeURIComponent(q)}` : ''));
  DATA = r.data; quarter = DATA.quarter;
  document.getElementById('sc-version').textContent = quarter;
  const meEl = document.getElementById('sc-me');
  meEl.textContent = DATA.me ? `${DATA.me.name} · ${roleWord(DATA.me.role)}` : 'Not signed in';
  meEl.style.color = DATA.me ? '' : 'var(--ax-orange)';
  render();
}
function render() {
  // The business half is loaded per quarter; a quarter change re-fetches it.
  if (segment === 'business' && (!IMPACT || IMPACT.quarter !== quarter) && !render._loading) { render._loading = true; loadImpact().then(() => { render._loading = false; render(); }).catch(err => { render._loading = false; toast(err.message); }); }
  const t = tab === 'leadership' ? null : DATA.tracks.find(x => x.id === tab);
  main.innerHTML = `
    <div class="sc-hero">
      <div><div class="ax-eyebrow">${segment === 'tech' ? 'Technology readiness' : 'Business readiness · impact'} · ${esc(quarter)}</div><h1>Scorecard</h1>
      <p>${segment === 'business' ? 'Is the business moving? Three pillars - Productivity, Velocity, Customer Trust - as needles with a baseline, a now and a target. Five fill themselves from the usage log; the rest are entered from MES, QMS and OJT records with their source. Every POC claims the needles it moves; the programme is as ready as its weakest pillar.' : 'SIB scores the lenses it has evidence for: L1 (does it work) and L2 (is SIB ready) for Content Pipeline, Hardware Fit and AR SDK. Each lens comes from criteria scored 1 to 5 with a confidence and evidence that links to what SIB holds. L3 to L5 and the verdict live on the master sheet; the verdict is recorded here so everyone sees it.'}</p></div>
      <div class="sc-tools">
        <span class="sc-seg" role="tablist" aria-label="Which half of the scorecard"><button class="${segment === 'tech' ? 'is-on' : ''}" data-seg="tech" title="Does it work · is SIB ready">Technology readiness</button><button class="${segment === 'business' ? 'is-on' : ''}" data-seg="business" title="Productivity · Velocity · Customer Trust">Business readiness · impact</button></span>
        <select class="ax-select" id="sc-quarter">${DATA.quarters.map(q => `<option value="${q}" ${q === quarter ? 'selected' : ''}>${q}</option>`).join('')}</select>
        <a class="ax-btn" href="/scorecard/export.xlsx?quarter=${encodeURIComponent(quarter)}"><svg class="ax-icon"><use href="/portal/brand/icons.svg#i-download"/></svg> Export to Excel</a>
        <button class="ax-btn" id="sc-rubric" title="How lenses, confidence and gates work"><svg class="ax-icon"><use href="/portal/brand/icons.svg#i-book"/></svg> Rubric</button>
      </div>
    </div>
    ${segment === 'business' ? business() : `<nav class="ax-tabs">${[['transition', 'Glasses transition'], ['leadership', 'Overview'], ...DATA.tracks.map(x => [x.id, x.name]), ['history', 'History']].map(([id, name]) => `<button class="${tab === id ? 'is-on' : ''}" data-tab="${id}">${esc(name)}</button>`).join('')}</nav>
    ${tab === 'transition' ? transition() : tab === 'leadership' ? leadership() : tab === 'history' ? history() : track(t)}`}`;
  main.querySelectorAll('.ax-tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  main.querySelectorAll('[data-seg]').forEach(b => b.onclick = async () => { segment = b.dataset.seg; if (segment === 'business' && (!IMPACT || IMPACT.quarter !== quarter)) await loadImpact(); location.hash = segment === 'business' ? '#business' : ''; render(); });
  if (segment === 'business') wireBusiness();
  document.getElementById('sc-quarter').onchange = e => load(e.target.value);
  document.getElementById('sc-rubric').onclick = openRubric;
  wire();
}

// ── Overview: where every track stands, and what changed ───────────────
// ── Glasses transition: the leadership question, answered per device by a stated rule ──
const TV = { 'READY FOR PILOT': ['Ready for pilot', 'v-ADVANCE'], 'ASSESSING': ['Assessing', 'v-CONTINUE'], 'NOT YET': ['Not yet', 'v-CLOSE'], 'NOT SCORED': ['Not scored', 'v-none'] };
function transition() {
  const T = DATA.transition; if (!T) return '<div class="ax-empty">No transition data.</div>';
  const pct = v => v === null || v === undefined ? '–' : `${Math.round(v * 100)} %`;
  const c = T.counts;
  const line = `${c.ready} ${c.ready === 1 ? 'device' : 'devices'} ready for pilot · ${c.assessing} assessing · ${c.notYet} not yet · ${c.notScored} not scored`;
  const found = T.foundation.map(f => `<span class="ax-chip ax-chip--text">${esc(f.name)}: <b class="${f.verdict ? 'v-' + f.verdict : 'v-none'}" style="margin-left:4px">${f.verdict ? VERDICT_TEXT[f.verdict] : 'not recorded'}</b></span>`).join(' ');
  return `
    <div class="ax-card" style="margin-bottom:var(--ax-s4)">
      <div class="ax-eyebrow">Are we ready for the AR glasses transition? · ${esc(T.quarter)}</div>
      <div style="font:var(--ax-h2);margin:4px 0 6px">${line}</div>
      <div class="ax-label-s ax-muted">Measured over ${T.publishedGuides} published work ${T.publishedGuides === 1 ? 'instruction' : 'instructions'}. Foundation: ${found || '–'}. A device is <b>ready for pilot</b> when L1 and L2 are ${T.rule.READY.minLens} or better, ${Math.round(T.rule.READY.minCoverage * 100)} % of the published steps are delivered on it (as authored or adapted) and it has ${T.rule.READY.minRuns} evidenced runs; <b>assessing</b> when scored with ${Math.round(T.rule.ASSESSING.minCoverage * 100)} % or more delivered; <b>not yet</b> when a lens is at 1 or 2 or coverage is below that; <b>not scored</b> until someone scores it. No dates are promised here.</div>
    </div>
    <div class="ld-grid">

// ── Track: lenses, criteria, scores with evidence ───────────────────────
function track(t) {
  const latest = t.latest;
  const lensBox = L => `

      <div class="rule">${L.suggested === null ? 'No criteria scored yet.' : `Suggested ${L.suggested}: ${esc(L.rule)}. ${L.scored} of ${L.of} criteria scored.`}${L.override ? `<br>Owner set ${L.override.score ?? 'confidence only'}${L.override.confidence ? ' · ' + L.override.confidence : ''}: "${esc(L.override.note)}" (${esc(L.override.by)}, ${L.override.at.slice(0, 10)})` : ''}</div>

        <select class="ax-select" name="confidence"><option value="">confidence</option><option>High</option><option>Medium</option><option>Low</option></select>
        <input class="ax-input" name="note" placeholder="why (required when overriding)" style="flex:1;min-width:160px">
        <button class="ax-btn" type="submit">Confirm lens</button>

    return `<tr>
      <td class="ax-label-s ax-muted">${k.lens}</td>

      <td class="score ${e ? 's' + e.score : ''}">${e ? e.score : '–'}</td>
      <td class="ax-label-s">${e ? `${esc(e.confidence)}<br><span class="ax-muted">${esc(e.by)} · ${e.at.slice(0, 10)}${e.deviceId ? ' · ' + esc(e.deviceId) : ''}</span>` : '<span class="ax-muted">not scored</span>'}</td>

  const perDevice = t.perDevice ? `<div class="ax-card" style="margin-top:var(--ax-s4)"><div class="ax-eyebrow" style="margin-bottom:6px">Per device · hardware fit is scored per headset; the track lens takes the latest per criterion across devices</div>

  const scoredAny = Object.keys(latest).length > 0;
  const howto = DATA.can.score && !seenHowto() ? `<div class="ax-card sc-howto" id="sc-howto">

    </div>` : DATA.can.score ? '' : `<div class="ax-notice" style="margin-bottom:var(--ax-s4)">${DATA.me ? `You are signed in as ${esc(DATA.me.name)} (${roleWord(DATA.me.role)}), reading only. ` : 'You are not signed in, so you are reading only. '}${WHO_SCORES}</div>`;
  const emptyRow = scoredAny ? '' : `<tr><td colspan="7" class="ax-muted" style="text-align:center;padding:14px">No criteria scored for ${esc(quarter)} yet.${DATA.can.score ? ' Start with the one you have evidence for.' : ''}</td></tr>`;
  return `
    ${howto}
    <div class="tr-top">${t.lenses.map(lensBox).join('')}</div>
    <div class="ax-card" style="margin-bottom:var(--ax-s4);display:flex;gap:var(--ax-s3);align-items:center;flex-wrap:wrap">

      <div class="ld-verdict ${t.master ? 'v-' + t.master.verdict : 'v-none'}" style="font-size:22px;line-height:26px;margin:2px 0">${t.master ? VERDICT_TEXT[t.master.verdict] : 'Not recorded'}</div>
      <div class="ax-label-s ax-muted">${t.master ? `${esc(t.master.by)} · ${t.master.at.slice(0, 10)}${t.master.note ? ' · ' + esc(t.master.note) : ''}` : 'Record it here after each review so the team sees it next to the criteria.'}</div></div>

    </div>
    <div class="ax-card"><table class="ax-table tr-table" style="font-size:0.84rem"><thead><tr><th>Lens</th><th>Criterion</th><th>Score</th><th>Confidence</th><th>Comment</th><th>Evidence</th><th></th></tr></thead><tbody>${emptyRow}${rows}</tbody></table></div>
    ${perDevice}`;
}
function evLink(l) {
  const r = esc(l.ref), label = esc(l.label || '');
  if (l.kind === 'import-log') return `<a href="/portal#content/guides" title="guide ${r}">import log · ${label || r.slice(0, 8)}</a>`;
  if (l.kind === 'guide') return `<a href="/portal#content/guides">guide · ${label || r.slice(0, 8)}</a>`;
  if (l.kind === 'readiness') return `<a href="/portal#content/guides">readiness · ${label || r.slice(0, 8)}</a>`;
  if (l.kind === 'session') return `<a href="/portal#analytics/inspections">session · ${label || r.slice(0, 8)}</a>`;
  if (l.kind === 'model') return `<a href="/portal#content/models">model · ${label || r.slice(0, 8)}</a>`;
  if (l.kind === 'link' && /^https?:\/\//.test(l.ref)) return `<a href="${r}" target="_blank" rel="noopener">${label || r}</a>`;
  return `<span>${esc(l.kind)} · ${label || r}</span>`;
}
let histWho = '';
function history() {
  const all = DATA.history;

  const people = [...new Set(all.map(e => e.by))].sort();
  const h = histWho ? all.filter(e => e.by === histWho) : all;
  const tname = id => (DATA.tracks.find(t => t.id === id) || {}).name || id;
  const cname = (tid, cid) => ((DATA.tracks.find(t => t.id === tid) || { criteria: [] }).criteria.find(k => k.id === cid) || {}).name || cid;
  return `<div class="hist-tools"><span class="ax-label-s ax-muted">Entered by</span><select class="ax-select" id="hist-who"><option value="">everyone (${all.length})</option>${people.map(p => `<option value="${esc(p)}" ${p === histWho ? 'selected' : ''}>${esc(p)} (${all.filter(e => e.by === p).length})</option>`).join('')}</select><span class="ax-label-s ax-muted">Every save is kept; the latest per criterion is the current score.</span></div>
  <div class="ax-card"><ul class="hist" style="list-style:none;margin:0;padding:0">${h.map(e => `<li><b>${esc(tname(e.trackId))}</b> · ${esc(cname(e.trackId, e.criterionId))}${e.deviceId ? ' · ' + esc(e.deviceId) : ''} → <b class="s${e.score}">${e.score}</b> ${esc(e.confidence)} · ${esc(e.by)} · ${e.at.replace('T', ' ').slice(0, 16)}${e.comment ? ' · ' + esc(e.comment) : ''} · ${e.evidence.length} evidence</li>`).join('')}</ul></div>`;
}

// ── Rubric: how a score becomes a lens, and a lens a verdict ─────────────
function openRubric() {
  const m = document.getElementById('sc-modal');
  const row = (a, b) => `<tr><td>${a}</td><td>${b}</td></tr>`;
  m.innerHTML = `<div class="ax-card rb">
    <button class="ax-btn" style="position:absolute;top:12px;right:14px" id="sc-close"><svg class="ax-icon"><use href="/portal/brand/icons.svg#i-close"/></svg></button>
    <div class="ax-eyebrow">Technology readiness</div><h2 style="margin:2px 0 0;font:var(--ax-h3)">Rubric</h2>
    <h3>Lenses</h3>
    <p>Each track is judged through five lenses on the master sheet. SIB scores the first two from criteria; L3 to L5 are the track owner's call.</p>
    <table class="ax-table" style="font-size:0.84rem"><tbody>
      ${row('L1 · 30 %', 'Technology readiness: does it work? 1 Concept · 2 Demo only · 3 Repeatable in a controlled setting · 4 Works in situ · 5 Proven in situ')}
      ${row('L2 · 25 %', 'SIB readiness: is the platform ready to deliver it? 1 Does not exist · 2 Scoped, not started · 3 In build · 4 Shipped with known gaps · 5 Shipped and reused')}
      ${row('L3 · 20 %', 'WMO process readiness (master sheet)')}
      ${row('L4 · 15 %', 'Automation impact (master sheet)')}
      ${row('L5 · 10 %', '3D OMS dependency (master sheet)')}
    </tbody></table>
    <h3>From criteria to a lens</h3>
    <p>Each criterion is scored 1 to 5 against its five level texts. The lens suggested is the lower of the rounded mean and the lowest criterion plus one, so one weak criterion drags the lens but does not alone decide it. The lens confidence is the lowest among its criteria. The track owner confirms or overrides with a written reason.</p>
    <h3>Confidence</h3>
    <table class="ax-table" style="font-size:0.84rem"><tbody>${['High', 'Medium', 'Low'].map(c => row(c, CONF_TEXT[c])).join('')}</tbody></table>
    <h3>Evidence</h3>
    <p>A 4 or 5 needs at least one link someone else can open: an import log, a guide, a readiness report, a session, a model, a URL or a file reference. A score without evidence is an opinion.</p>
    <h3>Gates on the master sheet</h3>
    <table class="ax-table" style="font-size:0.84rem"><tbody>
      ${row('ADVANCE', 'weighted 3.80 or more')}${row('CONTINUE', '3.00 to 3.79')}${row('PARK', '2.50 to 2.99, with a named re-entry trigger')}${row('CLOSE', 'below 2.50')}
      ${row('Vetoes', 'L4 at 1 or 2 closes the track · any lens at 1 parks it · any lens at 2 caps it at CONTINUE · a Low-confidence lens counts as at most 3 · fewer than five lenses scored gives no recommendation')}
    </tbody></table>
    <p class="ax-label-s ax-muted">Full text: docs/TRL-SCORECARD.md in the repo, and the Rubric sheet of the master workbook.</p>
  </div>`;
  m.classList.add('open');
  document.getElementById('sc-close').onclick = () => m.classList.remove('open');
  m.onclick = e => { if (e.target === m) m.classList.remove('open'); };
}

// ── Score a criterion ────────────────────────────────────────────────────
// Four questions in order: which level, how sure, where seen, what proves it.
const EV_HINT = { 'import-log': 'guide name or id (guide menu → Import log)', guide: 'guide name or id', readiness: 'guide name or id (guide menu → Device readiness)', session: 'session id from the Sessions page', model: 'model name or id from the Models page', link: 'https://…', file: 'SharePoint path or slide reference' };
async function openScore(t, k) {
  const m = document.getElementById('sc-modal');
  const gl = await guides();
  const pre = new URLSearchParams(location.hash.split('?')[1] || '');
  const preGuide = pre.get('guide') || '';

  m.innerHTML = `<div class="ax-card">
    <button class="ax-btn" style="position:absolute;top:12px;right:14px" id="sc-close"><svg class="ax-icon"><use href="/portal/brand/icons.svg#i-close"/></svg></button>
    <div class="ax-eyebrow">${esc(t.name)} · ${k.lens}</div>
    <h2 style="margin:2px 0 4px;font:var(--ax-h3)">${esc(k.name)}</h2>
    <p class="ax-label-s ax-muted" style="margin:0 0 10px">${esc(k.question)}</p>
    <form class="sc-form" id="score-form">
      <div class="step" style="border-top:0;padding-top:0"><p class="q"><b>1</b>Which line matches what you saw?</p>
        <div class="levels">${k.levels.map((text, i) => `<label><input type="radio" name="score" value="${i + 1}"><b>${i + 1}</b>${esc(text)}</label>`).join('')}</div>
        <div class="hint">Between two? Pick the lower and say below what would move it up.</div></div>
      <div class="step"><p class="q"><b>2</b>How sure are you?</p>
        <div class="chips">${['High', 'Medium', 'Low'].map(c => `<label class="${c === 'Medium' ? 'on' : ''}"><input type="radio" name="confidence" value="${c}" ${c === 'Medium' ? 'checked' : ''}><b>${c}</b>${CONF_TEXT[c]}</label>`).join('')}</div></div>
      <div class="step"><p class="q"><b>3</b>Where did you see it?</p>
        <div class="where">${devices}<label>Guide<select class="ax-select" name="guideId">${guideOpts}</select></label></div>
        <label class="hint" style="display:block;margin-top:8px">What you saw, and what would move it one point<textarea class="ax-textarea" name="comment" rows="3" style="margin-top:4px" placeholder="On which content or device, what happened, what is missing for the next level."></textarea></label></div>
      <div class="step" id="ev-step"><p class="q"><b>4</b>Evidence: what can someone else open to check?</p>
        <div class="hint">Usually ${esc(k.evidence)}.</div>
        <div class="ev-quick" id="ev-quick"></div>

        <div class="ev-quick"><button class="ax-btn" type="button" id="ev-add">+ add a link</button></div></div>
      <div class="row"><span class="as">Saved as ${esc(DATA.me.name)} · ${roleWord(DATA.me.role)} · ${esc(quarter)}</span><span style="flex:1"></span><button class="ax-btn ax-btn--primary" type="submit" id="ev-save">Save score</button></div>
    </form></div>`;
  m.classList.add('open');
  const f = document.getElementById('score-form');
  const rows = document.getElementById('ev-rows');
  const row = (kind = 'link', ref = '', label = '') => {
    const d = document.createElement('div'); d.className = 'ev-row';
    d.innerHTML = `<select class="ax-select" name="ekind">${Object.keys(EV_HINT).map(x => `<option ${x === kind ? 'selected' : ''}>${x}</option>`).join('')}</select><input class="ax-input" name="eref" placeholder="where it lives" value="${esc(ref)}"><input class="ax-input" name="elabel" placeholder="what it shows" value="${esc(label)}"><button class="x" type="button" title="remove"><svg class="ax-icon"><use href="/portal/brand/icons.svg#i-close"/></svg></button>`;
    const sel = d.querySelector('[name=ekind]'), refIn = d.querySelector('[name=eref]');

    const m = IMPACT.metrics.find(x => x.id === b.dataset.why);
    openModal(`<div class="ax-eyebrow">${esc(IMPACT.pillarsMeta.find(p => p.id === m.pillar).name)} · ${esc(m.unit)} · ${m.better} is better</div><h2 style="margin:4px 0 10px">${esc(m.name)}</h2>
      <p><b>What.</b> ${esc(m.what)}</p><p><b>How it is measured.</b> ${esc(m.how)}</p><p><b>Why it moves the business.</b> ${esc(m.why)}</p><p><b>Practice it is borrowed from.</b> ${esc(m.practice)}</p>${m.reference ? `<p class="ax-muted"><b>Reference range.</b> ${esc(m.reference)}</p>` : ''}
      <p class="ax-label-s ax-muted">Source: ${m.auto ? 'computed by SIB from the usage log every quarter' : 'entered by the owner from ' + esc(m.source.toUpperCase())}.</p>`);
  });
  main.querySelectorAll('[data-enter]').forEach(b => b.onclick = () => openEnter(b.dataset.enter));
  main.querySelectorAll('[data-wizard]').forEach(b => b.onclick = () => openWizard(b.dataset.wizard));
  const wa = document.getElementById('bi-wizard-all'); if (wa) wa.onclick = () => openWizard(null);
  const imp = document.getElementById('bi-import'), impF = document.getElementById('bi-import-file');
  if (imp && impF) { imp.onclick = () => impF.click(); impF.onchange = ev => importTemplate(ev.target.files[0]); }
  const son = document.getElementById('bi-sample-on'); if (son) son.onclick = async () => { try { await api('/scorecard/impact/sample', { method: 'POST', body: '{}' }); toast('Sample loaded'); await loadImpact(); render(); } catch (e) { toast(e.message); } };
  const soff = document.getElementById('bi-sample-off'); if (soff) soff.onclick = async () => { try { await api('/scorecard/impact/sample', { method: 'DELETE' }); toast('Sample removed'); await loadImpact(); render(); } catch (e) { toast(e.message); } };
}
// ── Guided entry: one needle at a time, with its why in view ──────────────
function openWizard(pillarId) {
  const I = IMPACT;
  const list = I.pillars.filter(p => !pillarId || p.pillar.id === pillarId).flatMap(p => p.metrics.map(m => ({ p, m })));
  const mo = document.getElementById('sc-modal');
  let i = 0; const done = new Set();
  const stepHtml = ({ p, m }, idx) => {
    const M = m.metric, auto = !!M.auto;
    return `<div class="wstep ${idx === i ? 'is-on' : ''}" data-i="${idx}">
      <div class="ax-eyebrow" style="color:${p.pillar.colour}">${esc(p.pillar.name)} · ${idx + 1} of ${list.length}</div>
      <h2 style="margin:4px 0 6px">${esc(M.name)} <span class="ax-muted" style="font:var(--ax-label)">${esc(M.unit)} · ${M.better} is better</span></h2>
      <div class="why"><b>What.</b> ${esc(M.what)}<br><b>How.</b> ${esc(M.how)}<br><b>Why it matters.</b> ${esc(M.why)}${M.reference ? `<br><b>Reference.</b> ${esc(M.reference)}` : ''}</div>
      <form data-step="${idx}" class="sc-form">
        <div class="grid2">
          <label>Baseline ${m.baseline !== null ? `<span class="ax-muted">(now ${fmtN(m.baseline, M.unit)})</span>` : ''}<input class="ax-input" name="baseline" type="number" step="any" placeholder="${m.baseline !== null ? 'keep' : 'the quarter before the platform'}"></label>
          <label>Target ${m.target !== null ? `<span class="ax-muted">(now ${fmtN(m.target, M.unit)})</span>` : ''}${I.can.target ? '' : '<span class="ax-muted">· Manager+</span>'}<input class="ax-input" name="target" type="number" step="any" ${I.can.target ? '' : 'disabled'} placeholder="${m.target !== null ? 'keep' : 'where the sponsor wants it'}"></label>
        </div>
        ${auto ? `<div class="ax-notice" style="margin:6px 0"><span>SIB computes this one from the usage log${m.now !== null ? ` - this quarter: <b>${fmtN(m.now, M.unit)}</b> (${esc(m.detail ?? '')})` : ' - no runs yet this quarter'}. Enter only the baseline and the target.</span></div>`
               : `<label>Value for ${esc(quarter)} ${m.now !== null ? `<span class="ax-muted">(now ${fmtN(m.now, M.unit)})</span>` : ''}<input class="ax-input" name="value" type="number" step="any" placeholder="${m.now !== null ? 'keep' : 'this quarter’s number'}"></label>`}
        <label>Source - the report, export or study the numbers come from <input class="ax-input" name="source" placeholder="${esc(I.sourceWords[M.source])}: report name, period, procedures"></label>
        <div class="grid2">
          <label>Scope (optional) <input class="ax-input" name="scope" placeholder="chamber · crew · procedure set"></label>
          <label>Confidence <select class="ax-select" name="confidence"><option>High</option><option selected>Medium</option><option>Low</option></select></label>
        </div>
        <label>Note (optional) <input class="ax-input" name="note"></label>
      </form>
    </div>`;
  };
  const shell = () => `<div class="ax-card bi-wiz"><div class="ax-eyebrow">Enter this quarter’s numbers · ${esc(quarter)}</div>
      <div class="wprog">${list.map((_, k) => `<i class="${done.has(k) ? 'done' : k === i ? 'on' : ''}"></i>`).join('')}</div>
      ${list.map(stepHtml).join('')}
      <div style="display:flex;gap:8px;justify-content:space-between;margin-top:14px;align-items:center">
        <span class="ax-label-s ax-muted">Leave a field blank to keep what SIB has. Nothing is saved without a source.</span>
        <span style="display:flex;gap:8px"><button class="ax-btn" id="wz-close">Close</button><button class="ax-btn" id="wz-skip">Skip</button><button class="ax-btn ax-btn--primary" id="wz-save">Save and next</button></span>
      </div></div>`;
  const show = () => {
    mo.innerHTML = shell(); mo.classList.add('open');
    document.getElementById('wz-close').onclick = async () => { mo.classList.remove('open'); await loadImpact(); render(); };
    document.getElementById('wz-skip').onclick = () => { if (i < list.length - 1) { i++; show(); } else { document.getElementById('wz-close').click(); } };
    document.getElementById('wz-save').onclick = async () => {
      const f = mo.querySelector(`form[data-step="${i}"]`);
      const { m } = list[i];
      const kinds = [['baseline', f.baseline.value], ['target', f.target && !f.target.disabled ? f.target.value : ''], ['value', f.value ? f.value.value : '']].filter(([, v]) => v !== '');
      if (!kinds.length) { document.getElementById('wz-skip').click(); return; }
      if (!f.source.value.trim()) { toast('Name the source - a number without a source is an opinion'); f.source.focus(); return; }
      try {
        for (const [kind, v] of kinds) await api('/scorecard/impact/entries', { method: 'POST', body: JSON.stringify({ metricId: m.metric.id, quarter, kind, value: Number(v), source: f.source.value, scope: f.scope.value, confidence: f.confidence.value, note: f.note.value }) });
        done.add(i); toast(`${m.metric.name} saved`);
        if (i < list.length - 1) { i++; show(); } else { document.getElementById('wz-close').click(); }
      } catch (e) { toast(e.message); }
    };
  };
  show();
}
// ── Import the filled template (.xlsx via SheetJS, loaded on demand; .csv natively) ──
async function importTemplate(file) {
  if (!file) return;
  try {
    let table;
    if (/\.csv$/i.test(file.name)) {
      table = (await file.text()).split(/\r?\n/).filter(Boolean).map(line => line.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(c => c.replace(/,$/, '').replace(/^"|"$/g, '').replace(/""/g, '"')));
    } else {
      if (!window.XLSX) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = () => no(new Error('Could not load the spreadsheet reader')); document.head.appendChild(s); });
      const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array' });
      table = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, blankrows: false });
    }
    const head = table[0].map(h => String(h).trim().toLowerCase());
    const col = name => head.findIndex(h => h.startsWith(name));
    const ci = col('metric id'), cb = col('baseline'), ct = col('target'), cv = col('value for'), cs = col('source of'), csc = col('scope'), cc = col('confidence'), cn = col('note');
    if (ci < 0) throw new Error('This is not the template - the "Metric id" column is missing');
    const rows = table.slice(1).filter(r => r[ci]).map(r => ({ metricId: r[ci], baseline: r[cb] ?? '', target: r[ct] ?? '', value: cv >= 0 ? (r[cv] ?? '') : '', source: r[cs] ?? '', scope: r[csc] ?? '', confidence: r[cc] ?? '', note: r[cn] ?? '' }));
    const res = await api('/scorecard/impact/import', { method: 'POST', body: JSON.stringify({ quarter, rows }) });
    toast(`${res.data.saved} number${res.data.saved === 1 ? '' : 's'} imported${res.data.skipped.length ? ` · ${res.data.skipped.length} rows left blank` : ''}`);
    await loadImpact(); render();
  } catch (e) { toast(e.message); }
}
function openModal(html) {
  const mo = document.getElementById('sc-modal');
  mo.innerHTML = `<div class="ax-card">${html}<div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="ax-btn" id="mo-close">Close</button></div></div>`;
  mo.classList.add('open');
  document.getElementById('mo-close').onclick = () => mo.classList.remove('open');
  mo.onclick = e => { if (e.target === mo) mo.classList.remove('open'); };
}
function openEnter(metricId) {
  const m = IMPACT.metrics.find(x => x.id === metricId);
  const kinds = m.auto ? [['baseline', 'Baseline'], ['target', 'Target']] : [['value', `Value for ${quarter}`], ['baseline', 'Baseline'], ['target', 'Target']];
  const mo = document.getElementById('sc-modal');
  mo.innerHTML = `<div class="ax-card"><div class="ax-eyebrow">${esc(IMPACT.pillarsMeta.find(p => p.id === m.pillar).name)} · ${esc(m.unit)}</div><h2 style="margin:4px 0 10px">${esc(m.name)}</h2>
    <p class="ax-muted" style="margin:0 0 12px">${esc(m.how)}</p>
    <form id="bi-form" class="sc-form">
      <label>What you are entering <select class="ax-select" name="kind">${kinds.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
      <label>Value (${esc(m.unit)}) <input class="ax-input" name="value" type="number" step="any" required></label>
      <label>Source - the report, export or study it comes from <input class="ax-input" name="source" placeholder="e.g. MES labour report, FY26-Q4, procedures WI-4471 and WI-4480" required></label>
      <label>Scope (optional) <input class="ax-input" name="scope" placeholder="chamber · crew · procedure set"></label>
      <label>Confidence <select class="ax-select" name="confidence"><option>High</option><option selected>Medium</option><option>Low</option></select></label>
      <label>Note (optional) <input class="ax-input" name="note"></label>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="ax-btn" id="bi-cancel">Cancel</button><button class="ax-btn ax-btn--primary">Save</button></div>
      ${!IMPACT.can.target ? '<div class="ax-label-s ax-muted">Targets need the Manager role or above.</div>' : ''}
    </form></div>`;
  mo.classList.add('open');
  document.getElementById('bi-cancel').onclick = () => mo.classList.remove('open');
  document.getElementById('bi-form').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    try {
      await api('/scorecard/impact/entries', { method: 'POST', body: JSON.stringify({ metricId, quarter, kind: f.kind.value, value: Number(f.value.value), source: f.source.value, scope: f.scope.value, confidence: f.confidence.value, note: f.note.value }) });
      mo.classList.remove('open'); toast('Saved'); await loadImpact(); render();
    } catch (err) { toast(err.message); }
  };
}
function wire() {
  main.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { tab = b.dataset.open; if (b.dataset.device) location.hash = `#${tab}?device=${encodeURIComponent(b.dataset.device)}`; render(); });
  const hh = document.getElementById('sc-howto-hide'); if (hh) hh.onclick = () => { try { localStorage.setItem('sib_scorecard_howto', '1'); } catch {} render(); };
  const hw = document.getElementById('hist-who'); if (hw) hw.onchange = () => { histWho = hw.value; render(); };
  const t = DATA.tracks.find(x => x.id === tab);
  if (!t) return;
  main.querySelectorAll('[data-score]').forEach(b => b.onclick = () => openScore(t, t.criteria.find(k => k.id === b.dataset.score)));
  main.querySelectorAll('form[data-lens]').forEach(f => f.onsubmit = async e => {
    e.preventDefault();
    try { await api('/scorecard/lens', { method: 'POST', body: JSON.stringify({ trackId: t.id, lens: f.dataset.lens, quarter, score: f.score.value ? Number(f.score.value) : undefined, confidence: f.confidence.value || undefined, note: f.note.value }) }); toast('Lens confirmed'); load(quarter); }
    catch (err) { toast(err.message); }
  });
  const mf = document.getElementById('master-form');
  if (mf) mf.onsubmit = async e => {
    e.preventDefault();
    if (!mf.verdict.value) { toast('Pick a verdict'); return; }
    try { await api('/scorecard/master', { method: 'POST', body: JSON.stringify({ trackId: t.id, quarter, verdict: mf.verdict.value, weighted: mf.weighted.value ? Number(mf.weighted.value) : undefined, note: mf.note.value }) }); toast('Verdict recorded'); load(quarter); }
    catch (err) { toast(err.message); }
  };
}
// Deep link: /scorecard#hardware-fit?guide=…  (from the readiness matrix)
const h = location.hash.slice(1).split('?')[0];
if (h && ['transition', 'leadership', 'content-pipeline', 'hardware-fit', 'ar-sdk', 'history'].includes(h)) tab = h;
if (h === 'business') segment = 'business';
load().then(async () => { if (segment === 'business') { await loadImpact(); render(); } });
</script>
