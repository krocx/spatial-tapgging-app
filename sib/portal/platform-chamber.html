<script type="module">
import * as THREE from 'three';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const $ = id => document.getElementById(id);

// ── Tokens → materials. Every colour comes from tokens.css at runtime. ───────
const css = getComputedStyle(document.documentElement);
function tok(name) {
  const v = css.getPropertyValue(name).trim();
  if (v.startsWith('rgb')) { const p = v.slice(v.indexOf('(') + 1, -1).split(',').map(Number); return new THREE.Color(p[0] / 255, p[1] / 255, p[2] / 255); }
  return new THREE.Color(v);
}
const C = { bg: tok('--ax-bg'), bg2: tok('--ax-bg-2'), solid: tok('--ax-solid'), ink: tok('--ax-ink'), grey: tok('--ax-grey'), blue: tok('--ax-blue'), cyan: tok('--ax-cyan'), green: tok('--ax-green'), orange: tok('--ax-orange'), red: tok('--ax-red'), teal: tok('--ax-teal'), purple: tok('--ax-purple') };
const shade = (c, l) => c.clone().offsetHSL(0, 0, l);
const M = {
  frame:  new THREE.MeshStandardMaterial({ color: shade(C.bg2, .04), roughness: .75, metalness: .25 }),
  metal:  new THREE.MeshStandardMaterial({ color: shade(C.grey, .08), roughness: .35, metalness: .7 }),
  metal2: new THREE.MeshStandardMaterial({ color: shade(C.grey, -.12), roughness: .45, metalness: .6 }),
  dark:   new THREE.MeshStandardMaterial({ color: C.bg, roughness: .6, metalness: .3 }),
  gown:   new THREE.MeshStandardMaterial({ color: shade(C.ink, -.06), roughness: .9 }),
  mask:   new THREE.MeshStandardMaterial({ color: shade(C.cyan, .2), roughness: .9 }),
  glove:  new THREE.MeshStandardMaterial({ color: shade(C.blue, .1), roughness: .7 }),
  cap:    new THREE.MeshStandardMaterial({ color: shade(C.blue, -.1), roughness: .5 }),
  screen: new THREE.MeshStandardMaterial({ color: C.blue, emissive: C.blue, emissiveIntensity: .6, roughness: .4 }),
  ghost:  new THREE.MeshBasicMaterial({ color: C.green, transparent: true, opacity: .35, depthWrite: false }),
  cone:   new THREE.MeshBasicMaterial({ color: C.blue, transparent: true, opacity: .16, depthWrite: false, side: THREE.DoubleSide }),
  sweep:  new THREE.MeshBasicMaterial({ color: C.green, transparent: true, opacity: .22, depthWrite: false, side: THREE.DoubleSide }),

  pad:    new THREE.MeshStandardMaterial({ color: C.solid, roughness: .5, metalness: .4 }),

const rim = (geo, col, at) => { const l = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), new THREE.LineBasicMaterial({ color: col })); if (at) l.position.copy(at); return l; };

// ── Stage ───────────────────────────────────────────────────────────────────
const hasGL = (() => { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; } })();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const BEATS = [
  { id: 'arrive',   name: 'Arrive',    dur: 8,  color: 'var(--ax-blue)',   eyebrow: 'One chamber · one technician', title: 'The work happens here.', cap: 'A technician in cleanroom PPE at a chamber. The instruction has to meet them on the metal, through whatever they can wear with that PPE.', links: [['The platform map', '/platform']] },
  { id: 'scan',     name: 'Scan',      dur: 9,  color: 'var(--ax-green)',  eyebrow: 'Spatial Intelligence Backbone', title: 'Scan once. One origin.', cap: 'A thirty-second scan lets SIB know this chamber by its shape. From then on every pin, every guide, every verdict knows where it lives.', links: [['How it works (IP key)', '/explain/spatial-intelligence']] },
  { id: 'pin',      name: 'Pin',       dur: 9,  color: 'var(--ax-green)',  eyebrow: 'AR OMS · adaptive guided work instructions', title: 'The step lands on the part.', cap: 'Step 3 pins to the focus ring. The ghost shows the correct result before the hands move.', links: [['Life of a work instruction', '/explain/lifecycle']] },
  { id: 'validate', name: 'Validate',  dur: 9,  color: 'var(--ax-blue)',   eyebrow: 'Spatial validation', title: 'SIB checks the work, not the checkbox.', cap: 'A cone of light brings the camera to the spot the ME trained. The verdict lands on the part with the evidence attached to the run.', links: [['In the catalogue', '/catalog#step-validation']] },
  { id: 'coach',    name: 'Coach',     dur: 8,  color: 'var(--ax-orange)', eyebrow: 'Presence & coaching', title: '"Look here" lands on the metal.', cap: 'The ME sees the step and the view, and sends a pin that arrives on the slit valve. Per session, announced, never recorded.', links: [['In the catalogue', '/catalog#presence-coaching']] },

const EYES = [
  { id: 'quest-3',        name: 'Quest 3 · binocular headset',  form: 'full',    color: 'var(--ax-green)',  win: [.08, .06, .10, .06], text: 'full model on the tool, as authored' },

  { id: 'oakley-vanguard',name: 'Oakley Vanguard · no display', form: 'spoken',  color: 'var(--ax-purple)', win: [.34, .30, .34, .30], text: 'read aloud; pass or fail by voice' },
  { id: 'ipad',           name: 'iPad · the companion',         form: 'app',     color: 'var(--ax-blue)',   win: [.14, .24, .12, .24], text: 'the reference player - and the companion to every wearable' },
];
const TOTAL = BEATS.reduce((a, b) => a + b.dur, 0);

if (!hasGL || reduced) { storyboard(); } else { play(); }

function storyboard() {
  document.body.classList.add('board');
  $('pc-board').classList.add('on');
  $('pc-board-grid').innerHTML = BEATS.map((b, i) => `<div class="ax-card" style="--ax-pc:${b.color}"><div class="ax-eyebrow">${i + 1} · ${esc(b.eyebrow)}</div><h3>${esc(b.title)}</h3><p>${esc(b.cap)}</p>${i === 5 ? `<p style="margin-top:8px">${EYES.map(e => esc(e.name.split(' · ')[0]) + ': ' + esc(e.text)).join(' · ')}</p>` : ''}</div>`).join('')

function play() {

  const key = new THREE.DirectionalLight(C.ink, 1.2); key.position.set(4, 7, 5); scene.add(key);
  const fill = new THREE.DirectionalLight(shade(C.cyan, .1), .35); fill.position.set(-5, 3, -3); scene.add(fill);

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: shade(C.bg2, -.02), roughness: .95 }));
  floor.rotation.x = -Math.PI / 2; scene.add(floor);
  const grid = new THREE.GridHelper(60, 100, shade(C.bg2, .08), shade(C.bg2, .05)); grid.position.y = .002; scene.add(grid);

  // ── The chamber (own geometry; a generic process module, not a real tool) ──
  const chamber = new THREE.Group(); scene.add(chamber);
  const add = (g, mesh) => { g.add(mesh); return mesh; };
  const box = (w, h, d, m, x, y, z) => { const mm = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); mm.position.set(x, y, z); return mm; };

  add(chamber, box(2.0, .9, 1.7, M.frame, 0, .45, 0));                 // mainframe
  add(chamber, box(2.04, .06, 1.74, M.metal2, 0, .93, 0));             // deck
  add(chamber, cyl(.22, .22, .22, M.metal2, 0, 1.07, 0));              // pedestal lift housing
  const body = add(chamber, cyl(.62, .62, .5, M.metal, 0, 1.43, 0));   // process chamber
  add(chamber, cyl(.66, .66, .06, M.metal2, 0, 1.71, 0));              // lid flange
  add(chamber, cyl(.5, .58, .14, M.metal, 0, 1.81, 0));                // lid
  add(chamber, cyl(.28, .28, .18, M.metal2, 0, 1.97, 0));              // showerhead / RF housing
  add(chamber, cyl(.08, .08, .3, M.dark, 0, 2.2, 0));                  // RF feed
  const focusRing = add(chamber, new THREE.Mesh(new THREE.TorusGeometry(.5, .045, 16, 64), M.metal2)); focusRing.rotation.x = Math.PI / 2; focusRing.position.set(0, 1.705, 0);

  add(chamber, box(.5, .12, .06, M.dark, 0, 1.38, .64));              // slit valve
  // gas panel at the right, lines into the lid
  add(chamber, box(.5, .7, .6, M.frame, 1.35, 1.28, -.3));
  for (let i = 0; i < 4; i++) add(chamber, cyl(.03, .03, .08, M.metal, 1.2 + i * .1, 1.68, -.3));
  const lines = [[[1.2, 1.6, -.3], [1.0, 2.1, -.35], [.3, 2.2, -.1], [.05, 2.05, 0]], [[1.3, 1.6, -.1], [1.05, 2.25, .1], [.35, 2.3, .1], [.08, 2.1, .05]], [[1.4, 1.6, -.5], [1.1, 2.0, -.6], [.25, 2.15, -.3], [.02, 2.02, -.08]]];
  for (const l of lines) add(chamber, new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(l.map(p => new THREE.Vector3(...p))), 24, .022, 8), M.metal));

  add(chamber, cyl(.12, .12, .4, M.metal2, -.4, 1.1, -.75, 24)).rotation.x = Math.PI / 2;
  add(chamber, new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(-.4, 1.1, -.95), new THREE.Vector3(-.6, .9, -1.4), new THREE.Vector3(-.6, .3, -1.6)]), 16, .06, 10), M.metal2));

  add(chamber, cyl(.04, .04, 1.3, M.metal2, -.55, 1.55, -.55));
  add(chamber, box(.5, .06, .06, M.metal2, -.3, 2.2, -.55));
  // status beacon
  add(chamber, cyl(.04, .04, .1, M.ok, .9, 2.0, .7));
  // origin marker (registration brackets on the floor)
  const origin = new THREE.Group(); origin.visible = false; scene.add(origin);
  { const s = 1.25, a = .3, pts = [];
    for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) { pts.push(sx * s, .01, sz * s, sx * (s - a), .01, sz * s, sx * s, .01, sz * s, sx * s, .01, sz * (s - a)); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    origin.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: C.green }))); }
  // scan sweep: a ring on the floor and a plane through the chamber
  const sweepRing = new THREE.Mesh(new THREE.RingGeometry(.98, 1, 64), M.sweep); sweepRing.rotation.x = -Math.PI / 2; sweepRing.position.y = .02; sweepRing.visible = false; scene.add(sweepRing);
  const sweepPlane = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 2.6), M.sweep); sweepPlane.rotation.y = Math.PI / 2; sweepPlane.position.y = 1.3; sweepPlane.visible = false; scene.add(sweepPlane);
  // the ghost (correct result) and the pin brackets on the focus ring
  const ghost = new THREE.Mesh(new THREE.TorusGeometry(.5, .05, 16, 64), M.ghost); ghost.rotation.x = Math.PI / 2; ghost.position.set(0, 1.705, 0); ghost.visible = false; scene.add(ghost);
  const pinBox = rim(new THREE.BoxGeometry(1.15, .16, 1.15), C.green); pinBox.position.set(0, 1.705, 0); pinBox.visible = false; scene.add(pinBox);
  const meBox = rim(new THREE.BoxGeometry(.66, .3, .2), C.orange); meBox.position.set(0, 1.38, .68); meBox.visible = false; scene.add(meBox);
  // cone of light (from the device to the part)
  const cone = new THREE.Mesh(new THREE.ConeGeometry(.22, 1, 32, 1, true), M.cone); cone.visible = false; scene.add(cone);

  // ── The technician, in cleanroom PPE ────────────────────────────────────
  const tech = new THREE.Group(); tech.position.set(-1.7, 0, .9); tech.lookAt(0, 0, .1); scene.add(tech);
  const tAdd = m => { tech.add(m); return m; };
  for (const sx of [-1, 1]) { tAdd(cyl(.09, .11, .82, M.gown, sx * .12, .41, 0, 16)); tAdd(box(.14, .08, .24, M.gown, sx * .12, .04, .04)); } // gown legs, bootie covers
  tAdd(cyl(.21, .3, .78, M.gown, 0, 1.21, 0, 24));                     // gown body
  tAdd(cyl(.19, .22, .1, M.gown, 0, 1.63, 0, 24));                     // hood collar
  const head = new THREE.Group(); head.position.set(0, 1.76, 0); tech.add(head);
  head.add(new THREE.Mesh(new THREE.SphereGeometry(.14, 24, 16), M.gown));                   // hood
  { const m = new THREE.Mesh(new THREE.SphereGeometry(.15, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2.1), M.cap); m.position.y = .035; head.add(m); } // bump cap
  { const m = box(.2, .09, .07, M.mask, 0, -.045, .115); head.add(m); }                      // face mask
  { const m = box(.22, .05, .04, M.dark, 0, .02, .13); head.add(m); }                        // safety goggles
  // arms pivot at the shoulder: the left holds the iPad (beat 6, iPad frame), the right reaches to the lid
  function arm(sx, rx, rz) { const g = new THREE.Group(); g.position.set(sx * .27, 1.52, .02); const a = cyl(.045, .05, .56, M.gown, 0, -.28, 0, 12); g.add(a); const glove = new THREE.Mesh(new THREE.SphereGeometry(.065, 16, 12), M.glove); glove.position.y = -.58; g.add(glove); g.rotation.set(rx, 0, rz); tech.add(g); return g; }
  const armL = arm(-1, -1.05, .18), armR = arm(1, -1.35, -.22);
  // the devices, swapped on the head per frame
  const dev = {};
  dev.headset = new THREE.Group(); { const b = box(.28, .13, .12, M.dark, 0, .0, .16); dev.headset.add(b); dev.headset.add(rim(new THREE.BoxGeometry(.28, .13, .12), C.green, b.position)); const s = new THREE.Mesh(new THREE.TorusGeometry(.16, .015, 8, 32), M.dark); s.rotation.x = Math.PI / 2; s.position.y = .02; dev.headset.add(s); }
  dev.glasses = new THREE.Group(); { dev.glasses.add(box(.25, .035, .02, M.dark, 0, .02, .145)); for (const sx of [-1, 1]) { const l = box(.085, .06, .012, M.pad, sx * .06, .005, .15); dev.glasses.add(l); dev.glasses.add(rim(new THREE.BoxGeometry(.085, .06, .012), C.teal, l.position)); } for (const sx of [-1, 1]) dev.glasses.add(box(.02, .02, .16, M.dark, sx * .125, .02, .07)); }
  dev.mono = new THREE.Group(); { dev.mono.add(box(.26, .03, .03, M.dark, 0, .07, .1)); dev.mono.add(cyl(.012, .012, .16, M.dark, .13, .02, .12, 8)).rotation.x = Math.PI / 2; const d = box(.05, .035, .02, M.pad, .09, -.04, .17); dev.mono.add(d); dev.mono.add(rim(new THREE.BoxGeometry(.05, .035, .02), C.orange, d.position)); dev.mono.add(box(.04, .05, .05, M.dark, .16, .03, .0)); }
  dev.none = new THREE.Group(); { const b = box(.27, .045, .025, M.dark, 0, .02, .14); dev.none.add(b); dev.none.add(rim(new THREE.BoxGeometry(.27, .045, .025), C.purple, b.position)); for (const sx of [-1, 1]) dev.none.add(box(.02, .02, .16, M.dark, sx * .135, .02, .07)); }
  for (const k in dev) { dev[k].visible = false; head.add(dev[k]); }
  const ipad = new THREE.Group(); ipad.position.set(.04, -.62, .1); ipad.rotation.set(.55, 0, 0); ipad.add(box(.26, .19, .012, M.dark, 0, 0, 0)); ipad.add(box(.23, .16, .004, M.screen, 0, 0, .007)); ipad.add(rim(new THREE.BoxGeometry(.26, .19, .012), C.blue)); ipad.visible = false; armL.add(ipad);
  function wear(k) { for (const d in dev) dev[d].visible = d === k; ipad.visible = k === 'ipad'; }

  // many chambers for the live beat
  const fleet = new THREE.InstancedMesh(new THREE.BoxGeometry(2, 1.4, 1.7), M.frame, 40);
  { const mt = new THREE.Matrix4(); let n = 0; for (let r = -2; r <= 2; r++) for (let c = -4; c <= 4; c++) { if (r === 0 && c === 0) continue; if (n >= 40) break; mt.makeTranslation(c * 3.4, .7, r * 3.6); fleet.setMatrixAt(n++, mt); } fleet.count = n; }
  fleet.visible = false; scene.add(fleet);
  const lit = new THREE.InstancedMesh(new THREE.BoxGeometry(2.06, 1.46, 1.76), new THREE.MeshBasicMaterial({ color: C.green, transparent: true, opacity: .18 }), 40); lit.visible = false; scene.add(lit);

  // ── Camera keyframes per beat ([position], [target]) ──────────────────────
  const CAMS = [
    [[1.2, 1.9, 4.6], [-.5, 1.2, .4]], [[2.8, 2.6, 3.4], [0, 1.2, 0]], [[1.5, 2.5, 1.9], [0, 1.7, 0]], [[.9, 2.3, 2.6], [0, 1.6, .2]],
    [[2.4, 1.9, 2.8], [-.2, 1.4, .5]], null /* POV */, [[0, 12, 16], [0, 0, 0]],
  ];
  const POV = [[-1.52, 1.78, .9], [0, 1.7, 0]];
  const ease = t => t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
  const V = a => new THREE.Vector3(...a);
  let camFrom = [V(CAMS[0][0]), V(CAMS[0][1])], camTo = camFrom, camT = 1, yaw = 0, yawV = 0;
  function aimAt(i) { const k = i === 5 ? POV : CAMS[i]; camFrom = [camera.position.clone(), look.clone()]; camTo = [V(k[0]), V(k[1])]; camT = 0; }
  const look = V(CAMS[0][1]);

  // ── UI ────────────────────────────────────────────────────────────────────
  const capEl = $('pc-cap'), beatsEl = $('pc-beats'), playBtn = $('pc-play');
  beatsEl.innerHTML = BEATS.map((b, i) => `<button class="pc-beat" data-i="${i}" title="${esc(b.title)}"><span class="bar"><i></i></span><span class="ax-mark"><i></i></span><span class="n">${esc(b.name)}</span></button>`).join('');
  const beatBtns = [...beatsEl.children]; beatBtns.forEach(b => b.onclick = () => seek(Number(b.dataset.i)));
  const bars = beatBtns.map(b => b.querySelector('.bar i'));
  let t = 0, playing = true, last = performance.now(), cur = -1, eyeIdx = -1, stats = null;
  const starts = []; { let a = 0; for (const b of BEATS) { starts.push(a); a += b.dur; } }
  function seek(i) { t = starts[i]; enter(i); }
  function setPlaying(p) { playing = p; playBtn.textContent = p ? 'Pause' : 'Play'; playBtn.title = p ? 'Pause (space)' : 'Play (space)'; }
  playBtn.onclick = () => setPlaying(!playing); setPlaying(true);
  document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); } if (e.key === 'ArrowRight') seek((cur + 1) % BEATS.length); if (e.key === 'ArrowLeft') seek((cur + BEATS.length - 1) % BEATS.length); });
  // drag to turn (adds a yaw on top of the keyframe, except in POV)

  cv.addEventListener('pointerup', () => { drag = null; });
  addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; fitFov(); renderer.setSize(innerWidth, innerHeight); if (eyeIdx >= 0) eye(EYES[eyeIdx]); });

  function caption(b, extra) {
    capEl.style.setProperty('--ax-pc', b.color);
    capEl.innerHTML = `<div class="ax-eyebrow">${esc(b.eyebrow)}</div><h2>${esc(b.title)}</h2><p>${esc(extra || b.cap)}</p><div class="pc-links">${b.links.map(([n, h]) => `<a href="${esc(h)}">${esc(n)}</a>`).join('')}</div>`;
  }
  const pins = { step: $('pin-step'), me: $('pin-me'), ok: $('pin-ok'), origin: $('pin-origin') };
  const pinAt = { step: new THREE.Vector3(.5, 1.75, 0), me: new THREE.Vector3(0, 1.5, .72), ok: new THREE.Vector3(-.5, 1.75, 0), origin: new THREE.Vector3(1.25, .05, 1.25) };
  function showPins(list) { for (const k in pins) pins[k].classList.toggle('on', list.includes(k)); }
  function projectPins() {
    for (const k in pins) { if (!pins[k].classList.contains('on')) continue; const v = pinAt[k].clone().project(camera); const vis = v.z < 1; pins[k].style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; pins[k].style.top = ((1 - v.y) / 2 * innerHeight) + 'px'; pins[k].style.visibility = vis ? 'visible' : 'hidden'; }
  }
  const eyeEl = $('pc-eye'), win = $('eye-win');
  function eye(e) {
    if (!e) { eyeEl.classList.remove('on'); return; }
    eyeEl.classList.add('on'); eyeEl.style.setProperty('--ax-pc', e.color);
    let [top, right, bottom, left] = e.win.map((f, i) => f * (i % 2 ? innerWidth : innerHeight)); top = Math.max(top, 84);
    if (innerWidth < 900 && (e.form === 'text' || e.form === 'spoken')) { top = 96; left = right = 16; bottom = Math.round(innerHeight * .5); }
    Object.assign($('sc-t').style, { left: 0, right: 0, top: 0, height: top + 'px' });
    Object.assign($('sc-b').style, { left: 0, right: 0, bottom: 0, height: bottom + 'px' });
    Object.assign($('sc-l').style, { left: 0, top: top + 'px', bottom: bottom + 'px', width: left + 'px' });
    Object.assign($('sc-r').style, { right: 0, top: top + 'px', bottom: bottom + 'px', width: right + 'px' });
    Object.assign(win.style, { top: top + 'px', right: right + 'px', bottom: bottom + 'px', left: left + 'px' });
    win.className = 'win' + (e.form === 'text' || e.form === 'spoken' ? ' page' : '') + (e.form === 'app' ? ' ipad-frame' : '');

    else if (e.form === 'spoken') win.innerHTML = tag + `<div class="ax-eyebrow">Spoken · step 3 of 12</div><div class="wave">${'<i></i>'.repeat(14)}</div><p>"Replace the focus ring. Lift at the two notches, seat the new ring flat. Say pass or fail."</p><div class="keys"><span>"next"</span><span>"pass"</span><span>"fail"</span></div>`;
    else win.innerHTML = tag;
  }

  function enter(i) {
    cur = i; const b = BEATS[i];
    beatBtns.forEach((x, k) => x.classList.toggle('on', k === i));
    caption(b);
    aimAt(i);
    // reset the actors; each beat turns on what it needs

    ghost.visible = pinBox.visible = i === 2 || i === 3 || i === 5; meBox.visible = i === 4; cone.visible = false;
    focusRing.material = i >= 4 ? M.ok : M.metal2;
    tech.visible = i !== 5 && i !== 6; chamber.visible = true; fleet.visible = lit.visible = i === 6;

    wear(i === 6 ? 'none' : 'glasses');

  }

  }

    camT = Math.min(1, camT + dt / 2.2); const e = ease(camT);
    const pos = camFrom[0].clone().lerp(camTo[0], e); look.copy(camFrom[1]).lerp(camTo[1], e);
    if (i !== 5) { yaw += (drag === null ? -.02 * dt : 0) + 0; const r = pos.clone().sub(look); r.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw); pos.copy(look).add(r); }
    camera.position.copy(pos); camera.lookAt(look);

    renderer.render(scene, camera);
  }
  function loop(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; step(dt); requestAnimationFrame(loop); }
  enter(0); requestAnimationFrame(loop);

  fetch('/stats').then(r => r.json()).then(s => { stats = s;
    $('lv-people').textContent = s.presenceNow ?? 0; $('lv-anchors').textContent = s.anchors ?? 0; $('lv-runs').textContent = s.guidedRuns ?? 0; $('lv-valid').textContent = s.validatedSteps ?? 0;
    if (cur === 6) wearFleet(); }).catch(() => {});
}
