<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SpatialTaggingApp — Wireframe v3</title>
<style>
:root{--bg:#f4f3ef;--panel:#fff;--border:#ddd9cd;--text:#2c2c2a;--t2:#5f5e5a;--t3:#888780;--acc:#185fa5;--acc-bg:#e6f1fb;--acc-t:#0c447c;}
*{box-sizing:border-box;}
body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;}
h1{font-size:18px;font-weight:700;margin:0 0 3px;}
.sub{color:var(--t2);margin:0 0 16px;font-size:12px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.tab{padding:7px 14px;border:1px solid var(--border);border-radius:7px;background:var(--panel);cursor:pointer;font-weight:500;color:var(--t2);font-size:12.5px;}
.tab.active{background:var(--acc-bg);color:var(--acc-t);border-color:var(--acc);}
.flowmap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-height:44px;}
.fnode{padding:5px 9px;border-radius:5px;background:#f1efe8;color:var(--t2);font-size:11.5px;cursor:pointer;border:1px solid transparent;white-space:nowrap;}
.fnode.cur{background:var(--acc-bg);color:var(--acc-t);border-color:var(--acc);font-weight:600;}
.farr{color:var(--t3);align-self:center;font-size:11px;}
.stage{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;}
/* phone */
.phone{width:310px;min-height:590px;border-radius:32px;padding:7px;background:#111;box-shadow:0 6px 22px rgba(0,0,0,.2);}
.pscreen{border-radius:26px;overflow:hidden;min-height:576px;display:flex;flex-direction:column;position:relative;background:#f2f2f7;color:#1c1c1e;}
.phone.dark .pscreen{background:linear-gradient(180deg,#15151a,#1f1f24);color:#fff;}
.meta{padding:9px 14px 3px;}
.meta .t{font-size:14px;font-weight:700;margin:0;}
.meta .s{font-size:10.5px;opacity:.55;margin:1px 0 0;}
.bscroll{flex:1;overflow:auto;padding:8px 12px 6px;}
.acts{display:flex;flex-direction:column;gap:6px;padding:6px 12px 12px;}
/* buttons */
.btn{padding:9px 11px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:12px;cursor:pointer;text-align:left;font-weight:500;}
.btn:hover{border-color:var(--acc);}
.btn.pri{background:var(--acc-bg);color:var(--acc-t);border-color:var(--acc);}
/* ios components */
.ilist{border-radius:11px;overflow:hidden;background:#fff;margin-bottom:10px;}
.phone.dark .ilist{background:rgba(255,255,255,.06);}
.irow{display:flex;align-items:center;gap:9px;padding:10px 11px;border-bottom:1px solid #e5e5ea;}
.phone.dark .irow{border-bottom:1px solid rgba(255,255,255,.08);}
.irow:last-child{border-bottom:none;}
.isec{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;opacity:.5;margin:12px 2px 5px;}
.ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.rm{flex:1;min-width:0;}
.rt{font-size:13px;font-weight:600;margin:0;}
.rs{font-size:10.5px;opacity:.55;margin:1px 0 0;}
.cv{opacity:.3;font-size:13px;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:18px;font-size:10px;font-weight:700;white-space:nowrap;}
.bg{background:#d2f4da;color:#1c7d34;} .bo{background:#ffe7c2;color:#ad6800;} .br{background:#ffd9d9;color:#c41e3a;}
.bb{background:#d9e8ff;color:#1456c9;} .bgy{background:#e6e6ea;color:#6b6b70;} .bp{background:#ede9ff;color:#6b41c7;}
.phone.dark .bg{background:rgba(52,199,89,.22);color:#67e08a;}
.phone.dark .bo{background:rgba(255,149,0,.22);color:#ffb454;}
.phone.dark .br{background:rgba(255,59,48,.22);color:#ff8a82;}
.phone.dark .bb{background:rgba(52,120,246,.22);color:#7da9ff;}
.phone.dark .bgy{background:rgba(255,255,255,.12);color:rgba(255,255,255,.6);}
.phone.dark .bp{background:rgba(140,82,255,.22);color:#c4a8ff;}
.smock{background:rgba(118,118,128,.12);border-radius:9px;padding:7px 9px;font-size:12px;color:#8e8e93;margin-bottom:9px;}
.pcard{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #d9e8ff;border-radius:11px;padding:10px 11px;margin-bottom:10px;}
/* AR screens */
.arbg{flex:1;position:relative;min-height:400px;overflow:hidden;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.05),transparent 40%),repeating-linear-gradient(135deg,#1a1a1f,#1a1a1f 14px,#232328 14px,#232328 28px);}
.topbar{position:absolute;top:0;left:0;right:0;padding:12px 12px 20px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);display:flex;align-items:center;justify-content:space-between;z-index:3;}
.tc{text-align:center;flex:1;}
.tc .t{font-size:12.5px;font-weight:700;color:#fff;margin:0;}
.tc .s{font-size:10px;color:rgba(255,255,255,.6);margin:1px 0 0;}
.chip{padding:4px 10px;border-radius:18px;background:rgba(255,255,255,.15);backdrop-filter:blur(6px);color:#fff;font-size:10.5px;font-weight:600;}
.ibd{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
.mkr{position:absolute;width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid #3478F6;background:rgba(52,120,246,.18);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;}
.mkr.g{border-color:#34C759;background:rgba(52,199,89,.25);}
.mkr.r{border-color:#FF3B30;background:rgba(255,59,48,.3);animation:pulse 1.4s infinite;}
.mkr.p{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.08);}
.mkr.v{border-color:#AF52DE;background:rgba(175,82,222,.25);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
.qrf{position:absolute;top:50%;left:50%;width:150px;height:150px;transform:translate(-50%,-50%);}
.qrf .co{position:absolute;width:24px;height:24px;border:3px solid #32ADE6;}
.qrf .tl{top:0;left:0;border-right:none;border-bottom:none;border-radius:7px 0 0 0;}
.qrf .tr{top:0;right:0;border-left:none;border-bottom:none;border-radius:0 7px 0 0;}
.qrf .bl{bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 7px;}
.qrf .br{bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 7px 0;}
.scard{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);width:210px;background:rgba(30,30,36,.75);backdrop-filter:blur(10px);border-radius:14px;padding:14px;text-align:center;color:#fff;z-index:2;}
.scard .si{font-size:24px;margin-bottom:6px;}
.scard .sm{font-size:12px;font-weight:600;}
.bsbar{position:absolute;left:0;right:0;bottom:0;padding:12px;background:linear-gradient(0deg,rgba(0,0,0,.78),transparent);z-index:3;}
.gc{background:rgba(255,255,255,.10);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:11px 13px;color:#fff;}
.fab{position:absolute;right:14px;bottom:82px;width:46px;height:46px;border-radius:50%;background:#3478F6;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.4);z-index:3;}
.dsh{background:#11121b;color:#fff;border-radius:16px 16px 0 0;padding:13px;flex:1;}
.dh{width:32px;height:4px;background:rgba(255,255,255,.2);border-radius:3px;margin:0 auto 10px;}
.cchip{flex:1;text-align:center;padding:8px 3px;border-radius:9px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);border:1px solid transparent;}
.cchip.sel{background:#162043;color:#7da9ff;border-color:rgba(52,120,246,.45);}
.schip{flex-shrink:0;padding:5px 11px;border-radius:18px;font-size:11px;font-weight:600;background:rgba(52,120,246,.14);color:#7da9ff;white-space:nowrap;}
.schip.s{background:#3478F6;color:#fff;}
.fl{font-size:10px;font-weight:700;letter-spacing:.05em;color:rgba(255,255,255,.4);margin-bottom:4px;}
.fm{background:rgba(255,255,255,.07);border-radius:8px;padding:10px 11px;font-size:12.5px;color:rgba(255,255,255,.4);margin-bottom:10px;}
/* zone ring */
.zring{width:110px;height:110px;border-radius:50%;margin:0 auto 10px;position:relative;background:conic-gradient(#34C759 0deg 260deg,rgba(255,255,255,.15) 260deg 360deg);display:flex;align-items:center;justify-content:center;}
.zring::before{content:"";position:absolute;width:88px;height:88px;border-radius:50%;background:#1a1a1f;}
.zring .zn{position:relative;z-index:1;font-size:19px;font-weight:700;color:#fff;}
.hbar{height:5px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:8px;}
.hbar .hf{height:100%;width:62%;background:#FFD60A;}
/* roi */
.roib{position:absolute;border:2.5px solid #32ADE6;box-shadow:0 0 0 9999px rgba(0,0,0,.55);z-index:1;}
.roih{position:absolute;width:13px;height:13px;border-radius:50%;background:#32ADE6;border:2px solid #fff;transform:translate(-50%,-50%);z-index:2;}
/* qr card */
.qrc{width:180px;height:180px;margin:14px auto 12px;background:#fff;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;}
/* results */
.shr{text-align:center;padding:12px 0 6px;}
.shr .shi{font-size:42px;line-height:1;}
.shr .shl{font-size:17px;font-weight:800;letter-spacing:.03em;margin-top:3px;}
.shr .shd{font-size:11.5px;opacity:.6;margin-top:2px;}
.ptr{height:6px;border-radius:3px;background:#ffd9d9;overflow:hidden;margin:8px 0 3px;}
.ptf{height:100%;background:#34C759;}
/* guide panel */
.gpanel{position:absolute;left:10px;right:10px;bottom:74px;background:rgba(18,18,26,.9);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:13px;color:#fff;z-index:4;}
.gnum{font-size:9.5px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.4);text-transform:uppercase;margin-bottom:3px;}
.gtit{font-size:13px;font-weight:700;margin:0 0 3px;}
.gbod{font-size:11px;color:rgba(255,255,255,.65);margin:0 0 9px;}
/* portal */
.pbody{background:#fff;border-radius:11px;overflow:hidden;border:1px solid #e0e0e0;}
.pbhead{background:#f8f8f8;padding:7px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #e0e0e0;}
.pbdots span{width:9px;height:9px;border-radius:50%;display:inline-block;}
.pburl{flex:1;background:#fff;border:1px solid #ccc;border-radius:5px;padding:3px 8px;font-size:11px;color:#666;}
.pnav{display:flex;border-bottom:1px solid #e5e5ea;padding:0 12px;overflow-x:auto;}
.ptab{padding:9px 11px;font-size:11.5px;font-weight:600;color:#8e8e93;border-bottom:2px solid transparent;white-space:nowrap;}
.ptab.a{color:#1456c9;border-color:#1456c9;}
.pcont{padding:12px 14px;min-height:340px;font-size:11.5px;color:#333;}
.ptbl{width:100%;border-collapse:collapse;font-size:11px;}
.ptbl th{background:#f8f8f8;text-align:left;padding:7px 8px;font-weight:600;color:#555;border-bottom:1px solid #e5e5ea;}
.ptbl td{padding:7px 8px;border-bottom:1px solid #f2f2f2;vertical-align:middle;}
.ptbl tr:last-child td{border-bottom:none;}
.pb{padding:3px 8px;border-radius:5px;border:1px solid #d9e8ff;background:#f0f6ff;color:#1456c9;font-size:10.5px;font-weight:600;cursor:pointer;}
.pbd{border-color:#ffd9d9;background:#fff5f5;color:#c41e3a;}
.phdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.phdr h3{margin:0;font-size:13px;font-weight:700;}
/* notes panel */
.notes{width:280px;min-height:590px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;}
.notes h2{font-size:14px;margin:0 0 6px;font-weight:600;}
.notes p{color:var(--t2);margin:0 0 10px;font-size:12.5px;}
.legend{display:flex;gap:12px;margin-top:14px;font-size:11.5px;color:var(--t2);flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:4px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
</style>
</head>
<body>
<h1>SpatialTaggingApp — App Flow Wireframe v3</h1>
<p class="sub">5 flows: Author · Operator · AR Guides · Gemba Walk · Portal &nbsp;|&nbsp; Click any node in the map or any button under the phone to navigate.</p>

<div class="tabs">
  <div class="tab active" id="tab-author"    onclick="setFlow('author')">Author flow</div>
  <div class="tab"        id="tab-operator"  onclick="setFlow('operator')">Operator flow</div>
  <div class="tab"        id="tab-arguides"  onclick="setFlow('arguides')">AR Guides</div>
  <div class="tab"        id="tab-gemba"     onclick="setFlow('gemba')">Gemba Walk</div>
  <div class="tab"        id="tab-portal"    onclick="setFlow('portal')">Portal</div>
</div>

<div class="flowmap" id="flowmap"></div>

<div class="stage">
  <div>
    <div class="phone" id="phoneShell">
      <div class="pscreen" id="screen"></div>
    </div>
    <div class="acts" id="actions"></div>
  </div>
  <div class="notes" id="notes"></div>
</div>

<div class="legend">
  <span><span class="dot" style="background:#34C759"></span>Trained / PASS</span>
  <span><span class="dot" style="background:#FF3B30"></span>FAIL / Issue</span>
  <span><span class="dot" style="background:#8E8E93"></span>Pending</span>
  <span><span class="dot" style="background:#AF52DE"></span>Gemba checkpoint</span>
</div>

<script>
// ── helpers ──────────────────────────────────────────────
function q(id){return document.getElementById(id);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function qrSVG(){
  var cells=["1110101110111","1000101000101","1011101011101","1011101011101","1000100000101","1110101110111","0000000000000","1011100010110","0101011101001","1110100101010","1000101110111","1011100000101","1110111011101"];
  var n=13, cell=140/n, out='<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" style="width:130px;height:130px;">';
  for(var r=0;r<n;r++) for(var c=0;c<n;c++) if(cells[r][c]==='1') out+='<rect x="'+(c*cell)+'" y="'+(r*cell)+'" width="'+cell+'" height="'+cell+'" fill="#111"/>';
  return out+'</svg>';
}

// ── screen definitions ────────────────────────────────────
var S = {};

// -------- AUTHOR FLOW --------
S['mode-select']={t:'Mode Selection',s:'First screen on launch',dk:true,note:'Entry point for both roles. Yellow name-confirm nudge appears until the author confirms their name in Settings. Version shown in subtitle. No QR gate at this point.',
body:'<div class="meta" style="padding-top:12px;"><div style="display:flex;align-items:center;gap:9px;"><div class="ic" style="background:linear-gradient(135deg,#3478F6,#32ADE6);font-size:15px;">&#x25A6;</div><div><p class="t" style="margin:0;">Spatial Tagging</p><p class="s" style="margin:0;">v1.4 &middot; SIB Phase 3</p></div><div style="flex:1;"></div><div class="ibd">?</div><div class="ibd">&#x2699;</div></div></div><div class="bscroll"><div style="background:rgba(255,193,7,.14);border:1px solid rgba(255,193,7,.3);border-radius:11px;padding:9px 11px;margin-bottom:10px;display:flex;gap:8px;align-items:center;"><span style="font-size:13px;">&#x1F464;</span><div style="flex:1;"><p style="margin:0;font-size:11.5px;font-weight:700;color:#FFD60A;">Confirm your name</p><p style="margin:1px 0 0;font-size:10.5px;color:rgba(255,255,255,.55);">Karthik &mdash; tap to confirm in Settings</p></div><span style="color:#FFD60A;font-size:11px;font-weight:600;">&#x2192; Settings</span></div><div class="gc" style="border-color:rgba(52,120,246,.3);background:rgba(255,255,255,.08);margin-bottom:9px;display:flex;align-items:center;gap:11px;"><div class="ic" style="background:rgba(52,120,246,.18);color:#7da9ff;">&#x270E;</div><div class="rm"><p class="rt" style="color:#fff;">Author Mode</p><p class="rs" style="color:rgba(255,255,255,.55);">Create and train inspection tags</p></div><span class="cv" style="color:#7da9ff;">&#x203A;</span></div><div class="gc" style="border-color:rgba(52,199,89,.3);background:rgba(255,255,255,.08);margin-bottom:14px;display:flex;align-items:center;gap:11px;"><div class="ic" style="background:rgba(52,199,89,.18);color:#67e08a;">&#x25C9;</div><div class="rm"><p class="rt" style="color:#fff;">Operator Mode</p><p class="rs" style="color:rgba(255,255,255,.55);">Run inspections and view results</p></div><span class="cv" style="color:#67e08a;">&#x203A;</span></div></div><div style="padding:0 12px 14px;"><div style="display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border-radius:9px;padding:8px 11px;"><span class="dot" style="background:#34C759;flex-shrink:0;"></span><span style="font-size:10.5px;color:rgba(255,255,255,.6);">SIB Connected &middot; sib-server.local</span></div></div>',
acts:[{l:'Tap "Author Mode"',to:'dir-author',f:'author',p:true},{l:'Tap "Operator Mode"',to:'dir-operator',f:'operator'}]};

S['dir-author']={t:'Anchor Directory',s:'My Anchors / Shared split',note:'My Anchors shows anchors you created (matched by a locally-stored ID set). Shared shows all others. The + toolbar button opens a 2-step anchor creation wizard, then navigates to the new anchor Hub.',
body:'<div class="meta"><p class="t">Anchor Directory</p></div><div class="bscroll"><div class="smock">&#x1F50D; Search anchors</div><div class="pcard"><div class="ic" style="background:#d9e8ff;color:#1456c9;">&#x1F310;</div><div class="rm"><p class="rt" style="color:#1456c9;">Anchor Directory Portal</p><p class="rs">Browse from any browser</p></div><span style="color:#1456c9;">&#x2197;</span></div><div class="isec">My Anchors</div><div class="ilist"><div class="irow"><div class="ic" style="background:#e6e6ea;">&#x1F4CD;</div><div class="rm"><p class="rt">Acme Pump Station</p><p class="rs">2 groups &middot; 5 tags</p></div><span class="badge bb">5 tags</span><span class="cv">&#x203A;</span></div></div><div class="isec">Shared Anchors</div><div class="ilist"><div class="irow"><div class="ic" style="background:#e6e6ea;">&#x1F4CD;</div><div class="rm"><p class="rt">Line 4 Conveyor</p><p class="rs">by Jane &middot; 0 tags</p></div><span class="badge bo">0 tags</span><span class="cv">&#x203A;</span></div></div></div>',
acts:[{l:'Tap "Acme Pump Station"',to:'hub-author',p:true},{l:'Tap + (new anchor wizard)',to:'hub-author'}]};

S['hub-author']={t:'Anchor Hub — Author',s:'Acme Pump Station command centre',note:'Hub shows Tag Groups, AR Guides, and Gemba Walk sections. Guides appear as draft or published. Tag groups are collapsible lists with swipe-to-edit/delete. QR row also provides PDF print link.',
body:'<div class="meta"><p class="t">Acme Pump Station</p><p class="s">Author</p></div><div class="bscroll"><div class="ilist"><div class="irow"><div class="ic" style="background:#e6e6ea;">&#x25A6;</div><div class="rm"><p class="rt">Anchor QR Code</p><p class="rs">AES-256 key embedded</p></div><span style="color:#1456c9;font-size:11.5px;font-weight:600;">Share</span></div><div class="irow"><span style="font-size:11px;color:#555;flex:1;">&#x1F4C4; Print PDF QR</span><span class="cv">&#x203A;</span></div></div><div class="isec">Tag Groups &middot; 2 groups &middot; 5 tags</div><div class="ilist"><div class="irow"><div class="ic" style="background:#d9e8ff;color:#1456c9;">&#x1F4E6;</div><div class="rm"><p class="rt">Electrical Panel</p><p class="rs">3 tags &middot; 2/3 trained</p></div><span class="badge bo">2/3</span><span class="cv">&#x203A;</span></div><div class="irow"><div class="ic" style="background:#d2f4da;color:#1c7d34;">&#x1F529;</div><div class="rm"><p class="rt">Valve Assembly</p><p class="rs">2 tags &middot; 2/2 trained</p></div><span class="badge bg">2/2</span><span class="cv">&#x203A;</span></div></div><div class="isec">AR Guides</div><div class="ilist"><div class="irow"><div class="ic" style="background:#ede9ff;color:#6b41c7;">&#x1F4CB;</div><div class="rm"><p class="rt">Startup Procedure</p><p class="rs">6 steps &middot; Published</p></div><span class="badge bg">Live</span><span class="cv">&#x203A;</span></div><div class="irow"><div class="ic" style="background:#e6e6ea;color:#6b6b70;">&#x1F4CB;</div><div class="rm"><p class="rt">Shutdown Checklist</p><p class="rs">4 steps &middot; Draft</p></div><span class="badge bgy">Draft</span><span class="cv">&#x203A;</span></div><div class="irow" style="justify-content:center;"><span style="color:#1456c9;font-size:12px;font-weight:600;">+ Create AR Guide</span></div></div><div class="isec">Gemba Walk</div><div class="ilist"><div class="irow"><div class="ic" style="background:rgba(175,82,222,.15);color:#AF52DE;">&#x1F4CD;</div><div class="rm"><p class="rt">Gemba Walk Audit</p><p class="rs">4 checkpoints defined</p></div><span class="cv">&#x203A;</span></div></div></div><div style="padding:6px 12px 12px;"><div style="background:#3478F6;color:#fff;border-radius:11px;padding:11px 13px;"><p style="margin:0;font-weight:700;font-size:13px;">&#x25B6; Enter AR Session</p><p style="margin:2px 0 0;font-size:10.5px;opacity:.85;">Scan QR to place / train tags</p></div></div>',
acts:[{l:'Tap "Enter AR Session"',to:'qrgate-author',p:true},{l:'Tap a Tag Group',to:'taglist'},{l:'Tap "Startup Procedure" guide',to:'guide-editor',f:'arguides'},{l:'Tap "Gemba Walk Audit"',to:'gemba-author',f:'gemba'}]};

S['qrgate-author']={t:'QR Scan Gate',s:'Mandatory AR lock — Author Mode',dk:true,note:'Downloads saved ARWorldMap first, relocalizes (orange banner) then shows viewfinder. Wrong QR shows a red error banner for a few seconds then lets you retry. First session on a brand-new anchor starts fresh (no map yet).',
body:'<div class="arbg"><div class="topbar"><span style="color:#fff;font-size:17px;">&#x2715;</span><div class="tc"></div><span class="chip">&#x270E; Author</span></div><div class="qrf"><div class="co tl"></div><div class="co tr"></div><div class="co bl"></div><div class="co br"></div></div><div class="scard"><div class="si">&#x25A6;</div><div class="sm">Point at the anchor QR code</div></div></div>',
acts:[{l:'Scan correct QR &rarr; origin locks',to:'ar-author',p:true},{l:'Scan wrong QR (error, retry)',to:'qrgate-author'}]};

S['ar-author']={t:'Author AR View',s:'Tap surface to place tags',dk:true,note:'Green = trained, faint ring = pending. Tap the + FAB or any real surface to place a new tag. Done saves the updated ARWorldMap to the server. Tag markers scale with distance.',
body:'<div class="arbg"><div class="topbar"><span style="color:rgba(255,255,255,.85);font-size:12px;font-weight:600;">Done</span><div class="tc"><p class="t">Acme Pump Station</p><p class="s">5 tags &middot; 4/5 trained</p></div><span style="color:#7da9ff;font-size:12px;font-weight:600;">Tag list</span></div><div class="mkr g" style="top:30%;left:22%;">&#x2713;</div><div class="mkr g" style="top:48%;left:52%;">&#x2713;</div><div class="mkr p" style="top:62%;left:70%;"></div><div class="fab">+</div><div class="bsbar"><div class="gc"><p style="margin:0;font-size:11.5px;font-weight:600;">&#x1F512; Origin locked &middot; 5 tags &middot; 4/5 trained</p><p style="margin:3px 0 0;font-size:11px;opacity:.75;">&#x1F446; Tap a surface to place a new tag</p></div></div></div>',
acts:[{l:'Tap surface &rarr; place new tag',to:'addtag',p:true},{l:'Open tag list',to:'taglist'},{l:'Tap Share QR icon',to:'qrgen'},{l:'Tap Done (end session)',to:'mode-select'}]};

S['addtag']={t:'New Tag',s:'Sheet after placing marker',dk:true,note:'Mode chip picks capture screen. Quick-suggest chips pre-fill label and type. Tag Group picker chips let you assign to an existing group or create a new one inline. Sheet blocks save if no AR surface was detected.',
body:'<div class="dsh"><div class="dh"></div><p style="font-weight:700;font-size:14px;margin:0 0 10px;">New tag</p><div style="display:flex;gap:7px;margin-bottom:9px;"><div class="cchip">&#x2B21; Honeycomb</div><div class="cchip sel">&#x25B2; Cone</div><div class="cchip">T OCR</div></div><div style="display:flex;gap:5px;overflow:auto;padding-bottom:7px;margin-bottom:9px;"><div class="schip s">Pressure Gauge</div><div class="schip">Safety Label</div><div class="schip">Valve Status</div><div class="schip">Cable Routing</div></div><div class="fl">LABEL</div><div class="fm">Pressure Gauge A</div><div class="fl">TAG GROUP</div><div style="display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap;"><div class="schip">Electrical Panel</div><div class="schip s">Valve Assembly &#x2713;</div><div class="schip">+ New group</div></div><div style="display:flex;flex-direction:column;gap:7px;"><div style="background:#3478F6;color:#fff;text-align:center;border-radius:10px;padding:10px;font-weight:700;font-size:12.5px;">&#x25B6; Train now</div><div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#fff;text-align:center;border-radius:10px;padding:10px;font-weight:600;font-size:12.5px;">Save &amp; train later</div><div style="text-align:center;color:rgba(255,255,255,.32);font-size:12px;padding:3px;">&#x2715; Cancel</div></div></div>',
acts:[{l:'Tap "Train now"',to:'capture',p:true},{l:'Tap "Save &amp; train later"',to:'ar-author'}]};

S['capture']={t:'Cone Capture — Pass State',s:'Walk the sweep to record reference images',dk:true,note:'19-zone dome guide rendered in AR. Green spheres = captured, yellow = actively held, cone hidden during sweep. Done Training enables once minimum zones covered. Honeycomb = 7-point hemisphere; OCR = single-shot review.',
body:'<div class="arbg"><div class="topbar" style="background:linear-gradient(180deg,rgba(0,0,0,.72),transparent);"><span style="color:#fff;font-size:15px;">&#x2715;</span><div class="tc"><p class="t">Pressure Gauge A</p><p class="s">Cone &middot; 14/19 zones &#x1F512;</p></div><div style="width:22px;"></div></div><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);text-align:center;"><div class="zring"><span class="zn">14/19</span></div><p style="color:#fff;font-size:11.5px;font-weight:600;margin:0;">Hold distance &middot; sweep slowly</p><p style="color:rgba(255,255,255,.55);font-size:10.5px;margin:3px 0 0;">5 more zones needed</p><div class="hbar" style="width:150px;margin:8px auto 0;"><div class="hf"></div></div></div><div class="bsbar"><div style="background:rgba(255,255,255,.12);color:#fff;text-align:center;border-radius:10px;padding:10px;font-weight:700;font-size:12.5px;opacity:.5;">Done Training</div><p style="text-align:center;color:rgba(255,255,255,.45);font-size:10px;margin:5px 0 0;">Cover 5 more zone(s) to enable</p></div></div>',
acts:[{l:'Finish sweep &rarr; Done Training',to:'failprompt',p:true},{l:'Capture error &rarr; retry inline',to:'capture'}]};

S['failprompt']={t:'Train Fail State?',s:'Optional — after Pass capture succeeds',dk:true,note:'Entirely optional. Training a Fail set enables relative nearest-match scoring (closer to Pass vs closer to Fail) instead of an absolute threshold. Skipping leaves the tag working exactly as before. Each state stored independently.',
body:'<div class="dsh" style="display:flex;flex-direction:column;justify-content:center;flex:1;"><div style="text-align:center;margin-bottom:16px;"><div style="font-size:30px;">&#x2713;</div><p style="font-weight:700;font-size:14px;margin:8px 0 3px;color:#fff;">Pass state trained</p><p style="font-size:11.5px;color:rgba(255,255,255,.55);margin:0 20px;">Also train what the WRONG condition looks like? (unplugged, closed, off) Makes validation more reliable.</p></div><div style="display:flex;flex-direction:column;gap:7px;"><div style="background:#3478F6;color:#fff;text-align:center;border-radius:10px;padding:10px;font-weight:700;font-size:12.5px;">&#x2B21; Train Fail State</div><div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#fff;text-align:center;border-radius:10px;padding:10px;font-weight:600;font-size:12.5px;">Skip &mdash; Pass only</div></div></div>',
acts:[{l:'Tap "Train Fail State"',to:'capture-fail',p:true},{l:'Skip',to:'roi-picker'}]};

S['capture-fail']={t:'Cone Capture — Fail State',s:'Same mechanic, wrong condition',dk:true,note:'Identical to Pass capture but arc turns red. Point at the equipment in its faulty/wrong condition. Stored as a completely separate reference set — retraining one state never affects the other.',
body:'<div class="arbg"><div class="topbar" style="background:linear-gradient(180deg,rgba(0,0,0,.72),transparent);"><span style="color:#fff;font-size:15px;">&#x2715;</span><div class="tc"><p class="t">Valve Handle B</p><p class="s">FAIL state &middot; Cone &middot; 9/19 &#x1F512;</p></div><div style="width:22px;"></div></div><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);text-align:center;"><div class="zring" style="background:conic-gradient(#FF3B30 0deg 170deg,rgba(255,255,255,.15) 170deg 360deg);"><span class="zn">9/19</span></div><p style="color:#fff;font-size:11.5px;font-weight:600;margin:0;">Show the WRONG condition</p><p style="color:rgba(255,255,255,.55);font-size:10.5px;margin:3px 0 0;">valve closed / handle removed</p><div class="hbar" style="width:150px;margin:8px auto 0;"><div class="hf" style="background:#FF3B30;width:47%;"></div></div></div><div class="bsbar"><div style="background:rgba(255,255,255,.12);color:#fff;text-align:center;border-radius:10px;padding:10px;font-weight:700;font-size:12.5px;opacity:.5;">Done Training</div></div></div>',
acts:[{l:'Finish sweep &rarr; Done Training',to:'roi-picker',p:true}]};

S['roi-picker']={t:'Mark Inspection Region',s:'Optional crop for validation',dk:true,note:'8 drag handles (4 corners + 4 edge midpoints). A magnifier loupe follows the finger while dragging. Saved as normalised 0-1 fractions on the tag. Skip validates full frame as before.',
body:'<div class="arbg" style="background:repeating-linear-gradient(135deg,#2a2a30,#2a2a30 14px,#34343a 14px,#34343a 28px);"><div style="position:absolute;top:10px;right:12px;color:rgba(255,255,255,.6);font-size:10.5px;font-weight:700;z-index:3;">Reset</div><div style="position:absolute;top:24px;left:0;right:0;text-align:center;z-index:2;padding:0 16px;"><p style="color:#fff;font-weight:700;font-size:12.5px;margin:0;">Mark Inspection Region</p><p style="color:rgba(255,255,255,.6);font-size:10px;margin:3px 0 0;">Drag the box around the tag feature. Skip = full frame.</p></div><div class="roib" style="top:36%;left:26%;width:46%;height:30%;"><div class="roih" style="top:0;left:0;"></div><div class="roih" style="top:0;left:100%;"></div><div class="roih" style="top:100%;left:0;"></div><div class="roih" style="top:100%;left:100%;"></div><div class="roih" style="top:0;left:50%;"></div><div class="roih" style="top:100%;left:50%;"></div><div class="roih" style="top:50%;left:0;"></div><div class="roih" style="top:50%;left:100%;"></div></div><div style="position:absolute;bottom:0;left:0;right:0;padding:12px;z-index:3;background:linear-gradient(0deg,rgba(0,0,0,.78),transparent);"><div style="display:flex;gap:7px;"><div style="flex:1;border:1px solid rgba(255,255,255,.3);color:#fff;text-align:center;border-radius:10px;padding:10px;font-weight:600;font-size:12px;">Skip</div><div style="flex:1;background:#32ADE6;color:#fff;text-align:center;border-radius:10px;padding:10px;font-weight:700;font-size:12px;">Use This Region</div></div></div></div>',
acts:[{l:'Drag handles to resize',to:'roi-picker'},{l:'Skip (full frame)',to:'ar-author'},{l:'Tap "Use This Region"',to:'ar-author',p:true}]};

S['taglist']={t:'Tag List',s:'Dark sheet — tags in this group',dk:true,note:'Sheet shows tags for the selected group. Swipe reveals Edit and Delete. Train on an unpositioned tag enters navigation mode — a pulsing target + live distance readout guides you back before opening capture.',
body:'<div class="dsh"><div class="dh"></div><p style="font-weight:700;font-size:14px;margin:0 0 1px;">Valve Assembly</p><p style="font-size:11px;opacity:.5;margin:0 0 12px;">2 tags &middot; all trained</p><div class="ilist" style="background:rgba(255,255,255,.06);margin-bottom:12px;"><div class="irow" style="border-bottom:1px solid rgba(255,255,255,.08);"><div class="ic" style="background:rgba(50,173,230,.18);color:#5fc7ec;">&#x1F4DF;</div><div class="rm"><p class="rt" style="color:#fff;">Pressure Gauge A</p><p class="rs">Cone &middot; Pass + Fail trained</p></div><span class="badge bg">Trained</span></div><div class="irow"><div class="ic" style="background:rgba(52,120,246,.18);color:#7da9ff;">&#x1F527;</div><div class="rm"><p class="rt" style="color:#fff;">Valve Handle B</p><p class="rs">Cone &middot; Pass only</p></div><span class="badge bg">Trained</span></div></div><p style="font-size:10px;color:rgba(255,255,255,.4);text-align:center;margin:0;">Swipe a row for Edit / Delete &middot; tap Train to navigate in AR</p></div>',
acts:[{l:'Swipe row &rarr; Edit',to:'edittag',p:true},{l:'Tap Train on untrained tag',to:'capture'},{l:'Close',to:'ar-author'}]};

S['edittag']={t:'Edit Tag',s:'Form: label, description, retrain options',note:'Standard light-mode form. Each retrain action is independent — touching one never affects the other. ROI adjustment applies to both states. Label/description changes saved to SIB on Save.',
body:'<div class="meta" style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;"><span style="color:#1456c9;font-size:12.5px;">Cancel</span><p class="t" style="font-size:13.5px;">Edit Tag</p><span style="color:#1456c9;font-size:12.5px;font-weight:700;">Save</span></div><div class="bscroll"><div class="isec">Tag Info</div><div class="ilist"><div class="irow"><span style="font-weight:500;">Type</span><div style="flex:1;"></div><span class="rs">Cone Capture</span></div><div class="irow"><span style="font-weight:500;">Group</span><div style="flex:1;"></div><span class="rs">Valve Assembly</span></div></div><div class="isec">Details</div><div class="ilist"><div class="irow"><div class="rm"><p class="rs" style="margin:0 0 1px;">Label</p><p class="rt" style="font-weight:500;">Pressure Gauge A</p></div></div><div class="irow"><div class="rm"><p class="rs" style="margin:0 0 1px;">Check Description</p><p class="rt" style="font-weight:500;">Verify amber connector seated</p></div></div></div><div class="isec">Training</div><div class="ilist"><div class="irow"><span style="color:#1456c9;">&#x1F4F7;</span><span style="color:#1456c9;font-weight:600;font-size:12.5px;">&nbsp;Re-capture Pass Images</span></div><div class="irow"><span style="color:#c41e3a;">&#x2B21;</span><span style="color:#c41e3a;font-weight:600;font-size:12.5px;">&nbsp;Re-capture Fail Images</span><div style="flex:1;"></div><span class="badge bg" style="font-size:9px;">trained</span></div><div class="irow"><span style="color:#1456c9;">&#x2B1A;</span><span style="color:#1456c9;font-weight:600;font-size:12.5px;">&nbsp;Adjust Region of Interest</span></div></div></div>',
acts:[{l:'Re-capture Pass Images',to:'capture',p:true},{l:'Re-capture Fail Images',to:'capture-fail'},{l:'Adjust Region of Interest',to:'roi-picker'},{l:'Cancel',to:'taglist'}]};

S['qrgen']={t:'Anchor QR Code',s:'Share sheet for operators',note:'Canonical PNG from the server — same one the web portal shows. The encryption key is embedded in this QR; treat it like a physical key to the anchor. PDF print version accessible from the Hub QR row.',
body:'<div class="meta" style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;"><span style="color:#1456c9;font-size:12.5px;">Close</span><p class="t" style="font-size:13.5px;">Anchor QR Code</p><div style="width:32px;"></div></div><div class="bscroll" style="text-align:center;"><div class="qrc">'+qrSVG()+'</div><div class="ilist" style="text-align:left;"><div class="irow"><span class="rs">Asset</span><div style="flex:1;"></div><span class="rt" style="font-weight:500;">Acme Pump Station</span></div><div class="irow"><span class="rs">Encryption</span><div style="flex:1;"></div><span class="rt" style="font-weight:500;font-size:11px;">AES-256-GCM embedded</span></div></div><div style="background:#3478F6;color:#fff;text-align:center;border-radius:10px;padding:10px;font-weight:700;font-size:12.5px;margin-top:4px;">&#x2191; Share QR Code</div></div>',
acts:[{l:'Share',to:'qrgen'},{l:'Close',to:'ar-author',p:true}]};

// -------- OPERATOR FLOW --------
S['dir-operator']={t:'Anchor Directory',s:'Operator: pick an anchor to inspect',note:'No + button for Operators. Anchors show readiness: green Ready (all trained), orange (some untrained), red (none trained). Routes to the Operator-specific Hub.',
body:'<div class="meta"><p class="t">Anchor Directory</p></div><div class="bscroll"><div class="smock">&#x1F50D; Search anchors</div><div class="isec">Anchors</div><div class="ilist"><div class="irow"><div class="ic" style="background:#e6e6ea;">&#x1F4CD;</div><div class="rm"><p class="rt">Acme Pump Station</p><p class="rs">5 tags &middot; last inspected 2h ago</p></div><span class="badge bg">Ready</span><span class="cv">&#x203A;</span></div><div class="irow"><div class="ic" style="background:#e6e6ea;">&#x1F4CD;</div><div class="rm"><p class="rt">Line 4 Conveyor</p><p class="rs">0 tags trained</p></div><span class="badge br">Not ready</span><span class="cv">&#x203A;</span></div></div></div>',
acts:[{l:'Tap "Acme Pump Station"',to:'hub-operator',p:true}]};

S['hub-operator']={t:'Anchor Hub — Operator',s:'Readiness check before AR',note:'Same hub, Operator view — no edit or delete, no + button. Readiness warning is non-blocking if some tags are trained, blocks if zero. AR Guides shows only published guides. Gemba Walk accessible if checkpoints exist.',
body:'<div class="meta"><p class="t">Acme Pump Station</p><p class="s">Operator</p></div><div class="bscroll"><div style="background:#fff3da;border:1px solid #ffd9a0;border-radius:9px;padding:9px 11px;display:flex;gap:7px;align-items:flex-start;margin-bottom:10px;"><span>&#x26A0;</span><span style="font-size:11px;color:#8a5400;">1 of 5 tags not yet trained &mdash; will show as PENDING.</span></div><div class="isec">Inspection &middot; 4/5 tags trained</div><div class="ilist"><div class="irow"><div class="ic" style="background:#d2f4da;color:#1c7d34;">&#x1F4DF;</div><div class="rm"><p class="rt">Pressure Gauge A</p></div><span class="badge bg">Trained</span></div><div class="irow"><div class="ic" style="background:#e6e6ea;">&#x1F527;</div><div class="rm"><p class="rt">Valve Handle B</p></div><span class="badge bo">Pending</span></div></div><div class="isec">AR Guides</div><div class="ilist"><div class="irow"><div class="ic" style="background:#ede9ff;color:#6b41c7;">&#x1F4CB;</div><div class="rm"><p class="rt">Startup Procedure</p><p class="rs">6 steps</p></div><span class="cv">&#x203A;</span></div></div><div class="isec">Gemba Walk</div><div class="ilist"><div class="irow"><div class="ic" style="background:rgba(175,82,222,.15);color:#AF52DE;">&#x1F4CD;</div><div class="rm"><p class="rt">Gemba Walk Audit</p><p class="rs">4 checkpoints</p></div><span class="cv">&#x203A;</span></div></div></div><div style="padding:6px 12px 12px;"><div style="background:#3478F6;color:#fff;border-radius:11px;padding:11px 13px;"><p style="margin:0;font-weight:700;font-size:13px;">&#x25B6; Enter AR Session</p><p style="margin:2px 0 0;font-size:10.5px;opacity:.85;">Scan anchor QR to begin inspection</p></div></div>',
acts:[{l:'Tap "Enter AR Session"',to:'qrgate-operator',p:true},{l:'Tap "Startup Procedure" guide',to:'guide-list-op',f:'arguides'},{l:'Tap "Gemba Walk Audit"',to:'gemba-operator',f:'gemba'}]};

S['qrgate-operator']={t:'QR Scan Gate',s:'Mandatory AR lock — Operator',dk:true,note:'Identical to Author QR gate. If QR has no embedded key (legacy QR), falls back to Keychain. If neither is available, shows a clear warning that validation will return 0% confidence and instructs the Operator to get the in-app QR from the Author.',
body:'<div class="arbg"><div class="topbar"><span style="color:#fff;font-size:17px;">&#x2715;</span><div class="tc"></div><span class="chip">&#x25C9; Operator</span></div><div class="qrf"><div class="co tl"></div><div class="co tr"></div><div class="co bl"></div><div class="co br"></div></div><div class="scard"><div class="si">&#x25A6;</div><div class="sm">Point at the anchor QR code</div></div></div>',
acts:[{l:'Scan correct QR &rarr; origin locks',to:'ar-operator',p:true}]};

S['ar-operator']={t:'Operator AR View',s:'Live PASS/FAIL markers — walk near tags',dk:true,note:'Markers update live: pending (gray), green (PASS), red blinking (FAIL). Yellow chip top-right opens threshold slider (40-90%). Tags with a Fail reference use relative nearest-match; Pass-only tags use the absolute threshold.',
body:'<div class="arbg"><div class="topbar"><span style="color:#fff;font-size:17px;">&#x2715;</span><div class="tc"><p class="t">Operator Mode</p><p class="s">Acme Pump Station &middot; Session #42</p></div><span class="badge bb" style="background:rgba(52,199,89,.3);color:#fff;">5 tags</span></div><div style="position:absolute;top:52px;right:12px;background:rgba(255,214,10,.22);color:#FFD60A;border-radius:18px;padding:4px 10px;font-size:10.5px;font-weight:700;z-index:3;">85%</div><div class="mkr g" style="top:28%;left:20%;">&#x2713;</div><div class="mkr g" style="top:44%;left:50%;">&#x2713;</div><div class="mkr r" style="top:58%;left:68%;">&#x2715;</div><div class="mkr p" style="top:36%;left:76%;"></div><div class="bsbar"><div class="gc" style="margin-bottom:7px;"><p style="margin:0;font-size:11.5px;font-weight:600;">3 / 5 tags inspected &middot; 2 PASS &middot; 1 FAIL</p><p style="margin:3px 0 0;font-size:11px;opacity:.7;">Walk toward remaining tags</p></div><div style="display:flex;gap:7px;"><div style="flex:1;background:rgba(255,255,255,.12);color:#fff;text-align:center;border-radius:10px;padding:9px;font-weight:700;font-size:12px;">&#x2316; Inspect All</div><div style="flex:1;background:#34C759;color:#fff;text-align:center;border-radius:10px;padding:9px;font-weight:700;font-size:12px;">End Inspection</div></div></div></div>',
acts:[{l:'Tap "Inspect All"',to:'results',p:true},{l:'Tap "End Inspection"',to:'results'}]};

S['results']={t:'Inspection Results',s:'Per-tag summary sheet',note:'Fail-first sorted. Session record submitted to SIB automatically on end — visible in Portal under Sessions. Re-inspect resets relevant markers and loops back into AR.',
body:'<div class="meta" style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;"><span style="color:#1456c9;font-size:12.5px;">Close</span><p class="t" style="font-size:13.5px;">Inspection Results</p><span style="color:#1456c9;font-size:12.5px;font-weight:700;">New Scan</span></div><div class="bscroll"><div class="shr"><div class="shi" style="color:#ad6800;">&#x25D0;</div><div class="shl" style="color:#ad6800;">PARTIAL</div><div class="shd">3 of 5 checks passed</div><div class="ptr"><div class="ptf" style="width:60%;"></div></div></div><div class="isec">Checks</div><div class="ilist"><div class="irow"><div class="ic" style="background:#ffd9d9;color:#c41e3a;">&#x1F527;</div><div class="rm"><p class="rt">Valve Handle B</p><p class="rs">41% confidence</p></div><span class="badge br">FAIL</span></div><div class="irow"><div class="ic" style="background:#d2f4da;color:#1c7d34;">&#x1F4DF;</div><div class="rm"><p class="rt">Pressure Gauge A</p><p class="rs">94% confidence</p></div><span class="badge bg">PASS</span></div></div></div><div class="acts" style="padding:5px 12px 12px;"><div style="background:#ffd9d9;color:#c41e3a;text-align:center;border-radius:10px;padding:10px;font-weight:700;font-size:12px;">&#x21BB; Re-inspect 1 Failed Tag</div><div style="border:1px solid #d9e8ff;color:#1456c9;text-align:center;border-radius:10px;padding:10px;font-weight:600;font-size:12px;margin-top:6px;">Re-inspect All Tags</div></div>',
acts:[{l:'Close',to:'ar-operator',p:true},{l:'Re-inspect failed',to:'ar-operator'},{l:'New Scan',to:'dir-operator'},{l:'Exit (X)',to:'mode-select'}]};

// -------- AR GUIDES --------
S['guide-list-auth']={t:'AR Guides — Author',s:'Manage guides for this anchor',note:'Author sees all guides (draft + published). Operator only sees published. Tap a guide to open its editor. Swipe to delete (cascades steps and evidence). Creating a new guide starts with just a name field.',
body:'<div class="meta" style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;"><span style="color:#1456c9;font-size:12.5px;">&#x2039; Hub</span><p class="t" style="font-size:13.5px;">AR Guides</p><span style="color:#1456c9;font-size:12.5px;font-weight:700;">+ New</span></div><div class="bscroll"><div class="ilist"><div class="irow"><div class="ic" style="background:#ede9ff;color:#6b41c7;">&#x1F4CB;</div><div class="rm"><p class="rt">Startup Procedure</p><p class="rs">6 steps &middot; Published &middot; by Karthik</p></div><span class="badge bg">Live</span><span class="cv">&#x203A;</span></div><div class="irow"><div class="ic" style="background:#e6e6ea;color:#6b6b70;">&#x1F4CB;</div><div class="rm"><p class="rt">Shutdown Checklist</p><p class="rs">4 steps &middot; Draft</p></div><span class="badge bgy">Draft</span><span class="cv">&#x203A;</span></div></div><p style="font-size:10.5px;color:var(--t2);margin:8px 2px;">Published guides are visible to Operators. Swipe to delete.</p></div>',
acts:[{l:'Tap a guide to edit',to:'guide-editor',p:true},{l:'Tap + New',to:'guide-editor'}]};

S['guide-editor']={t:'Guide Editor',s:'Name, steps, publish toggle',note:'Each step has a title (required), instruction text (optional), a reference photo captured at placement time, and an optional 3D USDZ model shown as a ghost overlay for Operators. Steps drag-reorderable. Publish makes guide visible to Operators.',
body:'<div class="meta" style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;"><span style="color:#1456c9;font-size:12.5px;">&#x2039; Guides</span><p class="t" style="font-size:13.5px;">Edit Guide</p><span style="color:#34C759;font-size:12.5px;font-weight:700;">Publish</span></div><div class="bscroll"><div class="isec">Guide Info</div><div class="ilist"><div class="irow"><div class="rm"><p class="rs" style="margin:0 0 1px;">Guide Name</p><p class="rt" style="font-weight:500;">Startup Procedure</p></div></div><div class="irow"><div class="rm"><p class="rs" style="margin:0 0 1px;">Description</p><p class="rt" style="font-weight:500;color:#8e8e93;">Add description&hellip;</p></div></div></div><div class="isec">Steps &middot; drag to reorder</div><div class="ilist"><div class="irow"><span style="opacity:.3;margin-right:3px;">&#x283F;</span><div class="rm"><p class="rt">1. Open main valve</p><p class="rs">tap to position in AR</p></div><span class="badge bg" style="font-size:9px;">Placed</span><span class="cv">&#x203A;</span></div><div class="irow"><span style="opacity:.3;margin-right:3px;">&#x283F;</span><div class="rm"><p class="rt">2. Check pressure gauge</p><p class="rs">3D model assigned</p></div><span class="badge bb" style="font-size:9px;">Model</span><span class="cv">&#x203A;</span></div><div class="irow"><span style="opacity:.3;margin-right:3px;">&#x283F;</span><div class="rm"><p class="rt">3. Verify power LED</p><p class="rs">not placed yet</p></div><span class="badge bgy" style="font-size:9px;">Unplaced</span><span class="cv">&#x203A;</span></div><div class="irow" style="justify-content:center;"><span style="color:#1456c9;font-size:12px;font-weight:600;">+ Add Step</span></div></div></div>',
acts:[{l:'Tap a step &rarr; Place in AR',to:'step-placement',p:true},{l:'Tap "+ Add Step"',to:'guide-editor'},{l:'Tap "Publish"',to:'guide-list-auth'}]};

S['step-placement']={t:'Step Placement in AR',s:'Author drops a pin for this step',dk:true,note:'Author taps a real AR surface to drop a numbered step pin (purple). A reference photo captures automatically when the pin is placed — this becomes the ghost overlay background for the Operator. Optionally assign a 3D USDZ model shown as ghost overlay.',
body:'<div class="arbg"><div class="topbar"><span style="color:#fff;font-size:15px;">&#x2715;</span><div class="tc"><p class="t">Place Step 2</p><p class="s">"Check pressure gauge"</p></div><span style="color:#7da9ff;font-size:12px;font-weight:600;">Done</span></div><div class="mkr v" style="top:44%;left:48%;">2</div><div style="position:absolute;top:52px;left:12px;background:rgba(22,22,30,.8);border-radius:10px;padding:7px 9px;z-index:3;"><p style="color:#fff;font-size:10.5px;font-weight:600;margin:0;">&#x1F4F8; Reference photo captured</p></div><div style="position:absolute;top:52px;right:12px;background:rgba(175,82,222,.22);border-radius:10px;padding:7px 9px;z-index:3;"><p style="color:#c4a8ff;font-size:10.5px;font-weight:700;margin:0;">&#x1F9CA; Gauge GLB assigned</p></div><div class="bsbar"><div class="gc"><p style="margin:0 0 3px;font-size:11.5px;font-weight:600;">&#x1F446; Tap a surface to place step pin</p><p style="margin:0;font-size:11px;opacity:.7;">Reference photo auto-captured &middot; 3D ghost in AR</p></div></div></div>',
acts:[{l:'Tap surface &rarr; pin placed',to:'step-placement'},{l:'Done &rarr; back to editor',to:'guide-editor',p:true}]};

S['guide-list-op']={t:'AR Guides — Operator',s:'Pick a published guide to follow',note:'Operators only see published guides. Tapping a guide goes through the same QR scan gate (relocalizes the AR session) then opens the guide session view.',
body:'<div class="meta" style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;"><span style="color:#1456c9;font-size:12.5px;">&#x2039; Hub</span><p class="t" style="font-size:13.5px;">AR Guides</p><div style="width:32px;"></div></div><div class="bscroll"><div class="ilist"><div class="irow"><div class="ic" style="background:#ede9ff;color:#6b41c7;">&#x1F4CB;</div><div class="rm"><p class="rt">Startup Procedure</p><p class="rs">6 steps &middot; ~8 min</p></div><span class="badge bg">Ready</span><span class="cv">&#x203A;</span></div></div><p style="font-size:10.5px;color:var(--t2);margin:8px 2px;">Only published guides appear here. Tap to begin &mdash; you will scan the anchor QR first.</p></div>',
acts:[{l:'Tap "Startup Procedure" &rarr; AR session',to:'ar-guide-session',p:true}]};

S['ar-guide-session']={t:'AR Guide Session',s:'Operator follows steps with floating panel',dk:true,note:'Numbered purple pins anchored to AR world positions. Completed steps turn green. Floating panel shows step title + instructions + optional 3D USDZ ghost overlay on real scene. Evidence photos optional per step. Panel togglable to show one at a time.',
body:'<div class="arbg"><div class="topbar"><span style="color:#fff;font-size:17px;">&#x2715;</span><div class="tc"><p class="t">Startup Procedure</p><p class="s">Step 2 of 6</p></div><span style="color:#7da9ff;font-size:11.5px;font-weight:600;">Steps &#x2191;</span></div><div class="mkr g" style="top:30%;left:24%;">1</div><div class="mkr v" style="top:46%;left:50%;">2</div><div class="mkr p" style="top:36%;left:72%;">3</div><div class="gpanel"><div class="gnum">Step 2 of 6</div><div class="gtit">Check pressure gauge</div><div class="gbod">Verify needle in green zone (1.2&ndash;1.8 bar). Do not proceed below 1.0 bar.</div><div style="display:flex;gap:7px;"><div style="flex:1;background:rgba(255,255,255,.1);color:#fff;text-align:center;border-radius:9px;padding:8px;font-size:11.5px;font-weight:600;">&#x1F4F7; Evidence</div><div style="flex:1;background:#3478F6;color:#fff;text-align:center;border-radius:9px;padding:8px;font-size:11.5px;font-weight:700;">&#x2713; Done</div></div></div></div>',
acts:[{l:'Done &rarr; advance to next step',to:'ar-guide-session',p:true},{l:'Evidence &rarr; capture photo',to:'ar-guide-session'},{l:'All steps complete &rarr; Sign Off',to:'guide-signoff'}]};

S['guide-signoff']={t:'Guide Sign-Off',s:'Submit sheet after last step',note:'Single POST to /guide-sessions with all step completions, duration, and sign-off name. Evidence photos uploaded as base64 and stored server-side. Session visible in Portal under AR Guides. No open/close lifecycle — whole session submitted atomically.',
body:'<div class="meta" style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;"><span style="color:#1456c9;font-size:12.5px;">Back</span><p class="t" style="font-size:13.5px;">Sign &amp; Submit</p><div style="width:32px;"></div></div><div class="bscroll"><div class="shr"><div class="shi" style="color:#34C759;">&#x2713;</div><div class="shl" style="color:#1c7d34;">All Steps Done</div><div class="shd">6 of 6 steps completed</div></div><div class="isec">Session Summary</div><div class="ilist"><div class="irow"><span style="font-weight:500;">Guide</span><div style="flex:1;"></div><span class="rs">Startup Procedure</span></div><div class="irow"><span style="font-weight:500;">Duration</span><div style="flex:1;"></div><span class="rs">7 min 34 sec</span></div><div class="irow"><span style="font-weight:500;">Evidence photos</span><div style="flex:1;"></div><span class="rs">4 captured</span></div></div><div class="isec">Sign Off</div><div class="ilist"><div class="irow"><div class="rm"><p class="rs" style="margin:0 0 1px;">Your name</p><p class="rt" style="font-weight:500;">Alex Chen</p></div></div></div><div style="background:#3478F6;color:#fff;text-align:center;border-radius:10px;padding:11px;font-weight:700;font-size:13px;margin-top:10px;">&#x2713; Sign &amp; Submit</div></div>',
acts:[{l:'Tap "Sign &amp; Submit"',to:'dir-operator',f:'operator',p:true},{l:'Back',to:'ar-guide-session'}]};

// -------- GEMBA WALK --------
S['gemba-author']={t:'Gemba Walk — Author AR',s:'Place and edit audit checkpoints in AR',dk:true,note:'Purple numbered pins mark Gemba checkpoints in AR. Tap the + FAB or any surface to add a new one (opens the form sheet). Tap an existing pin to edit it. List button shows all checkpoints with swipe-to-edit/delete. Author can upload a reference photo per checkpoint.',
body:'<div class="arbg"><div class="topbar"><span style="color:rgba(255,255,255,.85);font-size:12px;font-weight:600;">Done</span><div class="tc"><p class="t">Gemba Walk Audit</p><p class="s">4 checkpoints</p></div><span style="color:#c4a8ff;font-size:12px;font-weight:600;">List</span></div><div class="mkr v" style="top:27%;left:21%;">1</div><div class="mkr v" style="top:43%;left:54%;">2</div><div class="mkr v" style="top:59%;left:34%;">3</div><div class="mkr v" style="top:35%;left:74%;">4</div><div class="fab" style="background:#AF52DE;">+</div><div class="bsbar"><div class="gc" style="border-color:rgba(175,82,222,.3);"><p style="margin:0;font-size:11.5px;font-weight:600;">&#x1F512; Origin locked &middot; 4 checkpoints</p><p style="margin:3px 0 0;font-size:11px;opacity:.75;">&#x1F446; Tap surface to add a checkpoint</p></div></div></div>',
acts:[{l:'Tap surface &rarr; add checkpoint',to:'loctag-form',p:true},{l:'Tap existing pin &rarr; edit',to:'loctag-form'},{l:'Done',to:'hub-author',f:'author'}]};

S['loctag-form']={t:'Gemba Checkpoint Form',s:'Create / edit a loc-tag',note:'Title and defect category are required. Severity optional. Reference photo optional — when captured, Operators see it as a comparison thumbnail. Description saved as empty string if blank (server accepts this). Saved position is the 3D AR point tapped.',
body:'<div class="meta" style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;"><span style="color:#1456c9;font-size:12.5px;">Cancel</span><p class="t" style="font-size:13.5px;">Checkpoint 2</p><span style="color:#1456c9;font-size:12.5px;font-weight:700;">Save</span></div><div class="bscroll"><div class="isec">Details</div><div class="ilist"><div class="irow"><div class="rm"><p class="rs" style="margin:0 0 1px;">Title *</p><p class="rt" style="font-weight:500;">Check coolant level</p></div></div><div class="irow"><div class="rm"><p class="rs" style="margin:0 0 1px;">Description</p><p class="rt" style="font-weight:500;color:#8e8e93;">Add more details&hellip;</p></div></div></div><div class="isec">Classification</div><div class="ilist"><div class="irow"><span style="font-weight:500;">Defect Category</span><div style="flex:1;"></div><span class="rs" style="color:#1456c9;">Fluid Levels &#x203A;</span></div><div class="irow"><span style="font-weight:500;">Severity</span><div style="flex:1;"></div><span class="rs" style="color:#1456c9;">Medium &#x203A;</span></div></div><div class="isec">Reference Photo</div><div class="ilist"><div class="irow" style="justify-content:center;"><span style="color:#1456c9;font-size:12px;font-weight:600;">&#x1F4F7; Capture reference photo</span></div></div></div>',
acts:[{l:'Save checkpoint',to:'gemba-author',p:true},{l:'Cancel',to:'gemba-author'}]};

S['gemba-operator']={t:'Gemba Walk — Operator',s:'Navigation arrow guides to each checkpoint',dk:true,note:'Numbered purple pins visible in AR. The next unvisited checkpoint shows a directional arrow + distance readout. If the Author placed a reference photo, a relocalize ghost overlay appears when you first arrive. Tap the pin when you reach it to open the completion sheet.',
body:'<div class="arbg"><div class="topbar"><span style="color:#fff;font-size:17px;">&#x2715;</span><div class="tc"><p class="t">Gemba Walk Audit</p><p class="s">Checkpoint 2 of 4 &middot; 1 done</p></div><span style="color:#c4a8ff;font-size:11.5px;font-weight:600;">All &#x2191;</span></div><div class="mkr g" style="top:27%;left:21%;">1</div><div class="mkr v" style="top:43%;left:54%;">2</div><div class="mkr p" style="top:59%;left:34%;">3</div><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);text-align:center;z-index:3;"><div style="font-size:28px;animation:pulse 1s infinite;">&#x2B06;</div><p style="color:#c4a8ff;font-size:11.5px;font-weight:700;margin:3px 0 0;">1.4 m &middot; Checkpoint 2</p></div><div class="bsbar"><div class="gc" style="border-color:rgba(175,82,222,.3);"><p style="margin:0;font-size:11.5px;font-weight:600;color:#c4a8ff;">&#x25CF; Checkpoint 2: Check coolant level</p><p style="margin:3px 0 0;font-size:11px;opacity:.7;">Walk toward arrow &middot; tap pin when you arrive</p></div></div></div>',
acts:[{l:'Tap purple pin &rarr; completion sheet',to:'loctag-completion',p:true},{l:'Tap All &rarr; full list',to:'loctag-completion'}]};

S['loctag-completion']={t:'Checkpoint Completion',s:'Operator marks status + optional photo',note:'Three statuses: OK, Issue, Blocked. Reference photo shown as comparison thumbnail if captured by Author. Evidence photo optional. Submit POSTs to /loc-tags/:id/completion — record includes operator name, status, notes, timestamp. Results visible in Portal under Gemba Walk.',
body:'<div class="meta" style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;"><span style="color:#1456c9;font-size:12.5px;">Cancel</span><p class="t" style="font-size:13.5px;">Checkpoint 2</p><div style="width:32px;"></div></div><div class="bscroll"><div style="background:#f0f0f5;border-radius:10px;padding:9px;margin-bottom:10px;text-align:center;"><p style="font-size:10px;color:#8e8e93;margin:0 0 3px;">Reference photo</p><div style="height:72px;background:#d0d0d8;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#8e8e93;font-size:11.5px;">&#x1F4F8; coolant_ref.jpg</div></div><div class="isec">Status</div><div class="ilist"><div class="irow" style="background:#d2f4da;"><span style="color:#1c7d34;font-size:15px;">&#x2713;</span><div class="rm"><p class="rt" style="color:#1c7d34;">OK &mdash; as expected</p></div><span style="color:#1c7d34;">&#x25CF;</span></div><div class="irow"><span style="color:#ad6800;font-size:15px;">&#x26A0;</span><div class="rm"><p class="rt">Issue found</p></div></div><div class="irow"><span style="color:#c41e3a;font-size:15px;">&#x2715;</span><div class="rm"><p class="rt">Blocked / cannot inspect</p></div></div></div><div class="isec">Notes</div><div class="ilist"><div class="irow"><p style="margin:0;color:#8e8e93;font-size:12px;">Add notes&hellip;</p></div></div><div style="display:flex;gap:7px;margin-top:8px;"><div style="flex:1;border:1px solid #d9e8ff;color:#1456c9;text-align:center;border-radius:9px;padding:8px;font-size:11.5px;font-weight:600;">&#x1F4F7; Evidence</div><div style="flex:1;background:#3478F6;color:#fff;text-align:center;border-radius:9px;padding:8px;font-size:11.5px;font-weight:700;">Submit</div></div></div>',
acts:[{l:'Select OK + Submit',to:'gemba-operator',p:true},{l:'Select Issue + note + Submit',to:'gemba-operator'},{l:'Cancel',to:'gemba-operator'}]};

// -------- PORTAL --------
S['portal-home']={t:'Portal — Home',s:'Web portal: sib-server.local/portal',portal:true,ptab:'home',note:'Web portal lives at /portal on the SIB server. No login by default (API key optional via Settings). Five tabs cover all data types — Anchors, Sessions, AR Guides, Gemba Walk, 3D Models.',
body:'<div class="phdr"><h3>Spatial Inspection Backend</h3><div style="display:flex;gap:6px;"><span class="pb">Test Connection</span></div></div><p style="font-size:11.5px;color:#666;margin:0 0 12px;">Select a tab to manage anchors, view history, browse AR guide sessions, check Gemba completions, or manage the 3D model library.</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;"><div style="border:1px solid #e5e5ea;border-radius:9px;padding:10px;text-align:center;"><div style="font-size:20px;margin-bottom:3px;">&#x1F4CD;</div><p style="margin:0;font-size:11px;font-weight:600;">12 Anchors</p></div><div style="border:1px solid #e5e5ea;border-radius:9px;padding:10px;text-align:center;"><div style="font-size:20px;margin-bottom:3px;">&#x1F4CB;</div><p style="margin:0;font-size:11px;font-weight:600;">48 Sessions</p></div><div style="border:1px solid #e5e5ea;border-radius:9px;padding:10px;text-align:center;"><div style="font-size:20px;margin-bottom:3px;">&#x1F9CA;</div><p style="margin:0;font-size:11px;font-weight:600;">8 Models</p></div></div>',
acts:[{l:'Anchors tab',to:'portal-anchors',p:true},{l:'Sessions tab',to:'portal-sessions'},{l:'AR Guides tab',to:'portal-arguides'},{l:'Gemba Walk tab',to:'portal-gemba'},{l:'3D Models tab',to:'portal-models'}]};

S['portal-anchors']={t:'Portal — Anchors',s:'Manage anchors, download QR PDFs',portal:true,ptab:'anchors',note:'Each row: QR (browser preview), PDF (print-ready QR sheet), Delete (cascade: tags + pass-states + QR blob + world map). Delete All deletes every anchor and all their data.',
body:'<div class="phdr"><h3>Anchors</h3><div style="display:flex;gap:5px;"><span class="pb">+ Create</span><span class="pb pbd">&#x1F5D1; Delete All</span></div></div><table class="ptbl"><thead><tr><th>Name</th><th>Tags</th><th>Created</th><th>Actions</th></tr></thead><tbody><tr><td><strong>Acme Pump Station</strong></td><td>5</td><td>Jun 12</td><td><div style="display:flex;gap:4px;"><span class="pb">QR</span><span class="pb">PDF</span><span class="pb pbd">&#x1F5D1;</span></div></td></tr><tr><td><strong>Line 4 Conveyor</strong></td><td>0</td><td>Jul 1</td><td><div style="display:flex;gap:4px;"><span class="pb">QR</span><span class="pb">PDF</span><span class="pb pbd">&#x1F5D1;</span></div></td></tr></tbody></table><p style="font-size:10.5px;color:#999;margin:10px 0 0;">Delete All cascades through all child data. Cannot be undone.</p>',
acts:[{l:'Sessions tab',to:'portal-sessions',p:true},{l:'AR Guides tab',to:'portal-arguides'},{l:'Back: Home',to:'portal-home'}]};

S['portal-sessions']={t:'Portal — Inspection Sessions',s:'Per-anchor inspection history',portal:true,ptab:'sessions',note:'Sessions created automatically when an Operator ends an inspection. PASS ratio shown per session. Auto-pruned after 90 days by default. Delete All clears all session records.',

// ── flow definitions ──────────────────────────────────────
var F = {
  author:   ['mode-select','dir-author','hub-author','qrgate-author','ar-author','addtag','capture','failprompt','capture-fail','roi-picker','taglist','edittag','qrgen'],
  operator: ['mode-select','dir-operator','hub-operator','qrgate-operator','ar-operator','results'],
  arguides: ['guide-list-auth','guide-editor','step-placement','guide-list-op','ar-guide-session','guide-signoff'],
  gemba:    ['gemba-author','loctag-form','gemba-operator','loctag-completion'],
  portal:   ['portal-home','portal-anchors','portal-sessions','portal-arguides','portal-gemba','portal-models']
};

var FLOW_LABELS = {
  author:'Author (tag creation & training)',
  operator:'Operator (inspection)',
  arguides:'AR Guides (Author + Operator)',
  gemba:'Gemba Walk (Author + Operator)',
  portal:'Web Portal'
};

var PORTAL_TABS = {home:'Home',anchors:'Anchors',sessions:'Sessions',arguides:'AR Guides',gemba:'Gemba Walk',models:'3D Models'};

var curFlow = 'author', curScreen = 'mode-select';

function setFlow(f){
  curFlow = f;
  ['author','operator','arguides','gemba','portal'].forEach(function(id){
    q('tab-'+id).classList.toggle('active', id===f);
  });
  curScreen = F[f][0];
  render();
}

function goTo(id, f){
  if(f && f !== curFlow){
    curFlow = f;
    ['author','operator','arguides','gemba','portal'].forEach(function(fid){
      q('tab-'+fid).classList.toggle('active', fid===f);
    });
  }
  curScreen = id;
  render();
}

function buildPortalTabs(active){
  var out = '<div class="pnav">';
  Object.keys(PORTAL_TABS).forEach(function(k){
    var screenId = 'portal-'+(k==='home'?'home':k);
    out += '<div class="ptab'+(k===active?' a':'')+'" onclick="goTo(\''+screenId+'\')">'+PORTAL_TABS[k]+'</div>';
  });
  out += '</div>';
  return out;
}

function render(){
  // flowmap
  var fm = q('flowmap');
  fm.innerHTML = '';
  F[curFlow].forEach(function(id,i){
    var node = document.createElement('div');
    node.className = 'fnode'+(id===curScreen?' cur':'');
    node.textContent = S[id].t;
    node.onclick = (function(sid){return function(){goTo(sid);};})(id);
    fm.appendChild(node);
    if(i < F[curFlow].length-1){var a=document.createElement('div');a.className='farr';a.textContent='→';fm.appendChild(a);}
  });

  var s = S[curScreen];

  if(s.portal){
    // render portal as a light-bg phone screen with browser chrome inside
    q('phoneShell').className = 'phone';
    q('screen').innerHTML =
      '<div class="pbody" style="margin:8px;border-radius:14px;overflow:hidden;">' +
        '<div class="pbhead"><div class="pbdots"><span style="background:#FF5F57;"></span>&nbsp;<span style="background:#FEBC2E;"></span>&nbsp;<span style="background:#28C840;"></span></div>' +
        '<div class="pburl" style="margin-left:6px;">sib-server.local/portal</div></div>' +
        buildPortalTabs(s.ptab) +
        '<div class="pcont">'+s.body+'</div>' +
      '</div>';
  } else {
    q('phoneShell').className = 'phone'+(s.dk?' dark':'');
    q('screen').innerHTML = s.body;
  }

  // action buttons
  var ae = q('actions');
  ae.innerHTML = (s.acts||[]).map(function(a){
    return '<button class="btn'+(a.p?' pri':'')+'" data-to="'+a.to+'" data-f="'+(a.f||'')+'">'+a.l+'</button>';
  }).join('');
  ae.querySelectorAll('.btn').forEach(function(btn){
    btn.onclick = function(){ goTo(btn.dataset.to, btn.dataset.f||null); };
  });

  // notes
  q('notes').innerHTML = '<h2>'+s.t+'</h2><p style="font-size:11.5px;color:var(--t3);margin:-4px 0 10px;">'+s.s+'</p><p>'+s.note+'</p><p style="font-size:11.5px;color:var(--t3);">Flow: '+FLOW_LABELS[curFlow]+'</p>';
}

setFlow('author');
</script>
